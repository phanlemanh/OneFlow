[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oneflow-sdk"
version = "0.2.20"
description = "Python SDK for OneFlow — author plugins and run multi-modal GenAI workflows"
readme = "README.md"
requires-python = ">=3.10"
# The vietnormalizer pin is EXACT on purpose. This SDK now promises that a given
# string always reads out the same way (normalize-text-vi, AC-7), and a patch
# release of the reader that says one number differently is precisely what that
# promise rules out. A range here would make the promise unfalsifiable.
dependencies = [
    "pydantic>=2.0",
    "typing_extensions>=4.12",
    "vietnormalizer==0.2.3",
]
license = "AGPL-3.0-only"
authors = [{ name = "OneFlow contributors" }]
keywords = ["oneflow", "tongflow", "plugin", "workflow", "genai", "multimodal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/phanlemanh/OneFlow"
Repository = "https://github.com/phanlemanh/OneFlow"
Documentation = "https://github.com/phanlemanh/OneFlow/blob/main/docs/plugins.md"
Issues = "https://github.com/phanlemanh/OneFlow/issues"

# The IMPORT package stays `tongflow` on purpose (option C): only the
# distribution name moved to oneflow-sdk, so the 69 plugin files and 13 SDK
# files that `from tongflow import ...` keep working untouched. Renaming this
# include pattern would build an empty wheel without erroring.
[tool.setuptools.packages.find]
where = ["."]
include = ["tongflow*"]

[tool.setuptools.package-data]
# Bundle the ABI so a pip-installed tongflow can run workflows standalone.
# Kept in sync by `pnpm gen:abi` (see scripts/gen-abi-types.ts).
tongflow = ["_data/tongflow.abi.json"]
