schema_version: 1
feature_slug: skill-system-v1

# T3, surfaces [api, ui]. Moi khoa `config:executors.*.ssv1_*` duoi day duoc khai
# trong _acceptance/config.yaml o S1; tep test/script ma chung tro toi ra doi o S3.
#
# KHUON DO (measure-birth): moi eval may khai CHIEU DO tren cung fixture voi thong
# diep ghim ten luat/ma loi/duong dan — khong chi exit != 0.
#
# KHONG GIAN LUOT: moi eval cham DB hay plugin chay tren TONGFLOW_DATA_DIR va
# TONGFLOW_PLUGINS_DIR tam cua chinh no (xem ## Tien de cua contract). Khong eval
# nao doc/ghi data/ hay plugins/ cua nguoi dung, va khong eval nao do vao may chu
# o cong 3000 (cong do co the la may chu cua repo khac).

evals:
  # ---------- A. Dinh nghia skill ----------
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.ssv1_registry_integrity
    paths:
      - "src/lib/skills/**"
      - "scripts/skills/build-template.ts"
    expected: >-
      exit 0. Vong qua MOI skill trong registry (so skill doc tu registry, khong viet
      tay; khang dinh >= 2 de mot registry rong khong xanh), kiem sau luat: id = ten thu
      muc · version semver · requires = tap slot cua template · moi target ton tai ·
      moi outputs[].from ton tai · exportWorkflow(originalFlow) khop executable (bo
      exportedAt). CHIEU DO tren ban sao tung skill: pha dung MOT luat moi lan (sau ca),
      moi ca do voi thong diep ghim DUNG ten luat va id skill — sau luat = sau assert do.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- B. Tham so + instantiate ----------
  - id: E2
    criterion: AC-2
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ssv1_params_route
    paths:
      - "src/lib/skills/params.ts"
      - "src/app/api/skills/[id]/run/route.ts"
    expected: >-
      exit 0. Route that + DB that trong TONGFLOW_DATA_DIR tam. MA TRAN NAM LOP viet truoc,
      nam assert = nam phan tu cua SKILL_PARAM_REASONS doc tu params.ts (khong go tay; so
      lop assert bang do dai mang, lech la do): thieu bat buoc → required · sai kieu →
      type · so ngoai min/max → range · enum ngoai options → option · khoa la → unknown.
      Ca enum dung mot manifest fixture co tham so enum di qua DUNG params.ts cua san pham
      (hai skill that khong co enum). Moi ca: 400, code SKILL_PARAMS_INVALID, mang loi co
      dung {param, reason} cua ca do, dem tasks truoc/sau bang nhau. DOI CHUNG DUONG
      khang dinh: tham so hop le + registry plugin du → 200 {taskId} VA tasks tang DUNG 1
      (khong phai "khong tra SKILL_PARAMS_INVALID" — route tra 400 PLUGIN_NOT_INSTALLED
      hay 500 thi doi chung phai do). CHIEU DO: bo kiem khoa la trong params.ts thi ca
      unknown do voi thong diep ghim ten khoa.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.ssv1_instantiate
    paths:
      - "src/lib/skills/instantiate.ts"
      - "src/lib/skills/*/template.json"
      - "src/lib/skills/*/manifest.ts"
    expected: >-
      exit 0. Cho MOI skill trong registry x bo tham so mau cua no: (a) deep-equal
      template truoc/sau; (b) tung gia tri tham so doc duoc o executable (staticData hoac
      binding config) VA o originalFlow node.data — hai ve deu assert; (c) moi node mang
      pluginId lay tu slotDefaultPlugin gia (khac pluginId goc cua template, de phep so
      co nghia); (d) exportWorkflow(instance.originalFlow) khop instance.executable bo
      exportedAt. CHIEU DO tren cung fixture: bo buoc ghi vao originalFlow thi (d) do voi
      thong diep ghim nodeId + field lech; sua template tai cho thi (a) do.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- C. Nop luot chay ----------
  - id: E4
    criterion: AC-4
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ssv1_run_refusals
    paths:
      - "src/app/api/skills/[id]/run/route.ts"
      - "src/lib/skills/run.server.ts"
    expected: >-
      exit 0. Route that, DB tam. Ba ca: registry plugin khong co slot → 400
      PLUGIN_NOT_INSTALLED va mang slot bang dung slot thieu; id la → 404; chen san 3
      task pending → 429 CONCURRENT_TASK_LIMIT_EXCEEDED. Moi ca dem tasks truoc/sau bang
      nhau (ca 429: bang 3). DOI CHUNG: 2 task pending thi khong 429 — ve dan ap cua
      nguong. CHIEU DO: doi nguong thanh 4 thi ca 429 do voi thong diep ghim nguong.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ssv1_run_task_row
    paths:
      - "src/app/api/skills/[id]/run/route.ts"
      - "src/lib/skills/run.server.ts"
    expected: >-
      exit 0. POST hop le → 200 {taskId}; doc hang tasks theo taskId tu DB that:
      feature = "skill", plugin_id = "", JSON.parse(prompt) co DUNG tap khoa
      {skillId, skillVersion, params} (so tap khoa, khong chi co mat). CHIEU DO: them
      executable vao prompt thi ca do voi thong diep ghim khoa thua.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.ssv1_runner_dispatch
    paths:
      - "src/lib/task/runner.ts"
      - "src/lib/skills/instantiate.ts"
    expected: >-
      exit 0. dispatchTask tren task skill voi executeWorkflowViaEngine bi thay bang gia
      ghi lai doi so: executable nhan duoc deep-equal instantiate(prompt) tinh DOC LAP
      trong test (khong lay tu runner). Ca version lech: engine gia duoc goi 0 lan, task
      ket thuc failed, error mang ma SKILL_VERSION_CHANGED. CHIEU DO: runner bo qua kiem
      version thi ca version lech do voi thong diep ghim so lan goi engine.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ssv1_runs_collect
    paths:
      - "src/app/api/skills/runs/[taskId]/route.ts"
      - "src/lib/skills/run.server.ts"
    expected: >-
      exit 0. Ba task skill cua cung mot instance, DB tam: processing · completed · failed.
      Voi ca ba: `steps` co dung mot phan tu {nodeId, slot, status} cho MOI node cua
      instance (so phan tu = so node doc tu instantiate, khong go tay). completed: moi
      step done; result la ket qua THAT engine ghi vao tasks.result, ghi lai tu lan chay
      dau-cuoi (test-support/fixtures/tach-tieng-video.engine-result.json, khoa theo id
      node), outputs co dung tap key cua manifest, moi key tro dung file_key trong ban ghi. failed: error ghi bang
      DUNG workflowTaskFailureEnvelope + serializeTaskErrorForDb cua engine-delegate (writer
      that, khong go tay JSON), step co nodeId trong failures mang failed. Task feature
      "workflow" → 404; taskId la → 404. CHIEU DO: doi ten mot cong ra trong manifest thi
      do voi thong diep ghim key thieu; bo truong steps thi do ghim ten truong.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7b
    criterion: AC-10
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ssv1_runs_failed_step
    paths:
      - "src/app/api/skills/runs/[taskId]/route.ts"
      - "src/lib/task/runner.ts"
      - "src/lib/task/engine-delegate.server.ts"
    expected: >-
      exit 0. Chay task skill tach-tieng-video qua dispatchTask that voi tien trinh engine
      gia phat NDJSON that: node_started n1, node_completed n1, node_started n2,
      node_failed n2, roi result co failures [{nodeId: n2}]. Sau khi xong, GET runs tra
      status failed, step n1 done, step n2 failed. Suot luot, onTaskEvent ghi lai
      NODE_STARTED/NODE_COMPLETED/NODE_FAILED mang dung nodeId (day la nguon cua tien trinh
      song trong ngan). CHIEU DO: engine gia bao hong n1 thay n2 thi assert step n2 do voi
      thong diep ghim nodeId.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- D. Chay that dau-cuoi ----------
  - id: E8
    criterion: AC-8
    executor: script
    layer: backend-effect
    cmd: config:executors.script.ssv1_e2e_tach_tieng
    paths:
      - "src/lib/skills/**"
      - "src/app/api/skills/**"
      - "src/lib/task/runner.ts"
      - "scripts/skills/e2e-tach-tieng.sh"
    expected: >-
      exit 0. Script dat tien de TD-3..TD-8 trong mot thu muc luot tam (khong cham data/
      plugins/ cua nguoi dung), may chu cua CAY NAY o cong trong (tu kiem nhan dien cay
      truoc khi do; cay khac → exit 2 'may chu khong phai cay nay'), POST run
      tach-tieng-video voi video mau, mo SSE toi ket thuc, GET runs/<taskId>: status
      completed; moi output ton tai tren dia luot, > 0 byte; ffprobe: file am thanh co
      audio stream va KHONG video stream, file video co video stream va KHONG audio
      stream. Tien de hong → exit 2 kem ten tien de (khong phai exit 1 — do la tuong, khong
      phai san pham). Tra luot: xoa thu muc tam, dung may chu. CHIEU DO (SSV1_SAMPLE_SILENT=1,
      cung khuon video nhung KHONG co tieng; do 16/09): plugin extract-audio that hong, script
      exit 1 voi `run status failed` va run view ghi failedNodeIds ["a1"].
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- E. Giao dien ----------
  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.ssv1_sheet_list_form
    paths:
      - "src/components/workspace/skills/**"
      - "src/components/workspace/workspace-left-nav.tsx"
      - "src/i18n/messages/vi.json"
    expected: >-
      exit 0. jsdom, component that, messages vi doc tu tep. Payload danh sach lay tu
      handler THAT cua GET /api/skills goi trong cung test (registry plugin gia chi co slot
      ffmpeg) — khong go tay: hai the voi ten/mo ta bang gia tri tra tu vi.json theo khoa;
      the cat-canh-video mang nhan «Cần cài plugin cho bước: <nhan buoc split-video tu
      vi.json>» va khong mo duoc bieu mau; chon tach-tieng-video → so o bang so params cua
      manifest (doc tu manifest), o bat buoc co dau, «Chạy» disabled cho toi khi dien du
      roi enabled. CHIEU DO: bo required khoi mot param trong ban sao manifest thi assert
      dau bat buoc do voi thong diep ghim key param.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9b
    criterion: AC-9
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ssv1_skills_list_route
    paths:
      - "src/app/api/skills/route.ts"
      - "src/lib/skills/registry.ts"
    expected: >-
      exit 0. TONGFLOW_PLUGINS_DIR tam chua mot plugin fixture khai @node_slot cho
      extract-audio va remove-video-audio; registry plugin dung bo QUET THAT (khong mock
      nodePluginMap). GET /api/skills: tach-tieng-video missingSlots = [], cat-canh-video
      missingSlots = ["split-video"]. DOI CHUNG cung thu muc them plugin fixture khai
      split-video → ca hai rong. CHIEU DO: route tra missingSlots rong cho moi skill thi ca
      thieu do voi thong diep ghim id skill.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: test
    cmd: config:executors.test.ssv1_sheet_run_states
    paths:
      - "src/components/workspace/skills/**"
    expected: >-
      exit 0. jsdom. Du lieu KHONG go tay: (a) su kien SSE lay tu onTaskEvent khi dua cac
      dong NDJSON engine qua duong xu ly su kien that cua engine-delegate; (b) payload
      runs lay tu handler THAT cua GET /api/skills/runs/<taskId> goi trong cung test tren
      DB tam. Dang chay → moi buoc hien trang thai theo su kien; xong → moi output mot phan
      tu voi nhan manifest va link /api/uploads/<fileKey>; loi → cau loi tu i18n nhac DUNG
      nhan buoc hong (tra tu vi.json theo slot) + «Chạy lại»; bam «Chạy lại» gui lai DUNG
      params cu (so body request). CHIEU DO: doi ten truong steps o route thi E10 do voi
      thong diep ghim ten truong; xoa params khi loi thi ca «Chạy lại» do ghim param mat.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-11
    executor: test
    cmd: config:executors.test.ssv1_plan_to_canvas
    paths:
      - "src/components/workspace/skills/**"
      - "src/app/api/skills/runs/[taskId]/plan/route.ts"
    expected: >-
      exit 0. jsdom, store useFlow that: canvas rong → «Xem/sửa kế hoạch» dat nodes/edges
      bang dung do thi route plan tra, gia tri tham so doc duoc trong node.data; canvas co
      san 1 node → hien hop xac nhan, «Huỷ» → nodes/edges deep-equal truoc; «Thay» → do
      thi instance. CHIEU DO: bo hop xac nhan thi ca «Huỷ» do voi thong diep ghim so node
      bi mat.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11b
    criterion: AC-11
    executor: test
    layer: backend-effect
    cmd: config:executors.test.ssv1_plan_route
    paths:
      - "src/app/api/skills/runs/[taskId]/plan/route.ts"
      - "src/lib/skills/instantiate.ts"
    expected: >-
      exit 0. Route that, DB tam: task skill → {nodes, edges} deep-equal
      instantiate(prompt).originalFlow tinh doc lap; task khong phai skill → 404. CHIEU
      DO: route tra template goc thay vi instance thi ca do voi thong diep ghim param
      vang trong node.data.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    paths:
      - "src/components/workspace/skills/**"
      - "src/components/workspace/workspace-left-nav.tsx"
    steps:
      - "Dat tien de TD-3, TD-4, TD-8 bang config:executors.script.ssv1_luot (dat) — may chu cua CAY NAY o cong in ra; KHONG dung localhost:3000"
      - "Mo <url luot>/workspace → bam nut Skill → chup evidence/E12-step1.png (danh sach)"
      - "Chon «Tách tiếng khỏi video» → chup evidence/E12-step2.png (bieu mau, «Chạy» vo hieu)"
      - "Tai video mau len → chup evidence/E12-step3.png («Chạy» bat)"
    expected: "ba khung: danh sach hai skill tieng Viet; bieu mau voi o bat buoc co dau va Chạy vo hieu; sau tai len Chạy bat. network_observed: clean (co luu luong /api/skills va /api/upload)"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E12b
    criterion: AC-9
    executor: ui-check
    layer: ui-observed
    paths:
      - "src/components/workspace/skills/**"
      - "src/app/api/skills/route.ts"
    steps:
      - "Dat mot luot RIENG chi cai plugin ffmpeg (TD-4b) + TD-3 + TD-8 — may chu cua CAY NAY o cong in ra"
      - "Mo <url luot>/workspace → bam nut Skill → chup evidence/E12b-step1.png"
      - "Tra luot rieng"
    expected: "the «Cắt cảnh video» mo, mang nhan «Cần cài plugin cho bước: Tách cảnh», khong mo duoc bieu mau; the «Tách tiếng khỏi video» binh thuong. Dau hieu tu may chu: nhan do route GET /api/skills tinh tu registry plugin that cua luot, doc lai sau reload. network_observed: clean"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E13
    criterion: AC-10
    executor: ui-check
    layer: ui-observed
    paths:
      - "src/components/workspace/skills/**"
      - "src/app/api/skills/**"
      - "src/lib/task/runner.ts"
    steps:
      - "Tiep tu E12 tren cung may chu luot: bam «Chạy» → chup evidence/E13-step1.png (tien trinh)"
      - "Cho ket thuc → chup evidence/E13-step2.png (ket qua: hai dau ra co nhan, phat duoc)"
      - "Bam «Xem/sửa kế hoạch» tren canvas rong → chup evidence/E13-step3.png (canvas co hai node ffmpeg + node video mang dung file key da tai)"
      - "Tra luot bang config:executors.script.ssv1_luot (tra)"
    expected: "tien trinh theo buoc; ket qua co hai dau ra theo nhan manifest; canvas mang do thi instance. Dau hieu tu may chu: file key trong link dau ra la gia tri chi may chu sinh duoc cho luot nay, doc lai sau khi reload trang runs. network_observed: clean"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E14
    criterion: AC-10
    executor: script
    cmd: config:executors.script.ssv1_a11y_proto
    paths:
      - "src/components/proto/skill-system-v1-proto.tsx"
      - "src/components/workspace/skills/**"
      - "scripts/skills/check-a11y-proto.sh"
    expected: >-
      exit 0. axe-core trong Chrome that tren moi trang thai cua bang trang thai (11) x
      sang/toi, may chu rieng cong 3198 NEXT_DIST_DIR=build/ssv1-a11y tu dung tu don;
      0 vi pham critical/serious. NUA DAN AP: doc lai data-proto-state tung trang, dem
      11 trang thai PHAN BIET x 2 theme phan biet. CHIEU DO: doi mot ten state thanh chuoi
      khong ton tai thi do voi thong diep `rendered state 'unknown:<ten>', asked for '<ten>'`.
    evidence_required: [run_id, exit_code, verifier, verified_at, output, artifact]

  - id: E15
    criterion: AC-10
    executor: script
    cmd: config:executors.design.gate
    status: not-run
    paths:
      - "src/components/proto/skill-system-v1-proto.tsx"
    expected: >-
      KHONG CHAY — gioi han da biet, khai tu S1. Tien le da do o
      chong-mat-khoa-byo-giao-dien E10 (31/08): design-gate duoi jsdom khong parse noi
      Tailwind v4 nen doc moi phan tu la chu den tren nen trong suot; E14 (axe-core trong
      Chrome that) la san a11y cua AC-10.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- F. Bang chung nen tang ----------
  - id: E16
    criterion: AC-12
    executor: script
    cmd: config:executors.script.ssv1_second_skill_paths
    paths:
      - "src/lib/skills/**"
      - "scripts/skills/check-second-skill-paths.sh"
    expected: >-
      exit 0. Ba ve, moi ve mot dong PASS/FAIL co ten. (1) DUONG DAN: tim commit THEM
      src/lib/skills/tach-tieng-video/manifest.ts bang `git log --diff-filter=A`; dung mot
      commit (0 hoac > 1 → exit 2 ghim so dem); moi duong dan commit do cham nam tron trong
      danh sach cho phep; registry.ts dung 1 dong them 0 dong xoa. (2) KHUNG DA DU TRUOC:
      git worktree tam tai <commit>^ (duong dan tam suy tu mktemp, khong hardcode ROOT),
      chay ssv1_registry_integrity + ssv1_instantiate + ssv1_runner_dispatch o do → xanh.
      (3) KHONG NHANH RIENG: tai HEAD, git grep cac chuoi tach-tieng-video, extract-audio,
      remove-video-audio trong src/lib/skills/*.ts, src/lib/task, src/app/api,
      src/lib/workflow → 0 dong. CHIEU DO (teeth, `--teeth`, repo tam): commit them skill
      kem mot dong trong src/lib/workflow/exporter.ts → ve 1 do ghim DUNG duong dan; commit
      them 2 dong registry → ve 1 do ghim so dong; commit CHA them `if (skillId ===
      "tach-tieng-video")` vao runner → ve 3 do ghim duong dan + chuoi.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- G. Loi san pham ----------
  - id: E17
    criterion: AC-13
    executor: judgment
    question: "Một người bán hàng không rành kỹ thuật đọc ngăn skill ở mọi trạng thái — tên, mô tả, nhãn, lỗi có nói bằng lời sản phẩm, không lộ từ nội bộ (slot, plugin id, ABI, executable, taskId) không?"
    inputs:
      - "_acceptance/skill-system-v1/contract.md"
      - "src/i18n/messages/vi.json"
      - "_acceptance/skill-system-v1/evidence/E12-step1.png"
      - "_acceptance/skill-system-v1/evidence/E12b-step1.png"
      - "_acceptance/skill-system-v1/evidence/E13-step2.png"
      - "_acceptance/skill-system-v1/evidence/design-pass/bieumau-loi-tham-so--desktop--light.png"
      - "_acceptance/skill-system-v1/evidence/design-pass/bieumau-ban--desktop--light.png"
      - "_acceptance/skill-system-v1/evidence/design-pass/ketqua-loi--mobile--light.png"
      - "_acceptance/skill-system-v1/evidence/design-pass/danhsach-thieu-plugin--mobile--light.png"
    evidence_required: [judged_by, verdict, rationale]

  - id: E17b
    criterion: AC-13
    executor: test
    cmd: config:executors.test.ssv1_copy_no_internal_terms
    paths:
      - "src/i18n/messages/*.json"
    expected: >-
      exit 0. (a) Moi khoa Skills.* ton tai o ca nam tep messages (en, vi, zh, ja, ko). (b)
      Moi ma trong SKILL_PARAM_REASONS doc tu params.ts co khoa Skills.invalid.<ma> o ca
      nam tep: so khoa invalid.* = so ma, lech la do. (c) Moi slot trong requires cua moi
      skill trong registry co khoa Skills.skills.<id>.steps.<slot> o ca nam tep. (d) Gia tri
      vi cua moi khoa Skills.* khong chua tu cam (slot, plugin id, pluginId, ABI, executable,
      taskId, node) — danh sach la MOT hang so trong test, so tu kiem bang so phan tu. CHIEU
      DO: chen «slot» vao mot nhan vi trong ban sao thi do ghim khoa + tu cam; them mot ma
      vao SKILL_PARAM_REASONS ma khong them khoa i18n thi (b) do ghim ma thieu.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
