<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Một lượt skill chạy thế nào</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --paper: #f7f7f8; --ink: #1a0033; --muted: #4f4a63; }
  body { font-family: 'Geist', system-ui, sans-serif; background: var(--paper); color: var(--ink);
    display: flex; justify-content: center; padding: 2.5rem 2rem; }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
  h1 { font-family: 'Instrument Serif', 'Lora', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em;
    line-height: 1.15; margin-bottom: 1.5rem; }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Luồng dọc · d-1 · AC-5 · AC-6 · AC-7 · AC-10</p>
  <h1>Một lượt skill là một hàng tasks, instantiate lại lúc chạy</h1>

  <svg viewBox="0 0 1160 1016" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f4a63"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e100e1"/></marker>
      <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0068cc"/></marker>
      <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c8102e"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#f7f7f8"/>

    <!-- ============ CONNECTORS ============ -->
    <line x1="520" y1="88" x2="520" y2="124" stroke="#4f4a63" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="520" y1="224" x2="520" y2="260" stroke="#4f4a63" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="532" y="232" width="72" height="16" rx="2" fill="#f7f7f8"/>
    <text x="536" y="244" fill="#66607a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CHÈN TASK</text>
    <line x1="520" y1="344" x2="520" y2="380" stroke="#4f4a63" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="520" y1="448" x2="520" y2="484" stroke="#4f4a63" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- runner -> engine (version matches) -->
    <line x1="520" y1="568" x2="520" y2="604" stroke="#e100e1" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="532" y="576" width="96" height="16" rx="2" fill="#f7f7f8"/>
    <text x="536" y="588" fill="#a300a3" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">VERSION KHỚP</text>
    <line x1="520" y1="688" x2="520" y2="724" stroke="#4f4a63" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="520" y1="792" x2="520" y2="828" stroke="#4f4a63" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- runner -> failed (version mismatch) -->
    <line x1="720" y1="528" x2="796" y2="528" stroke="#c8102e" stroke-width="1.2" marker-end="url(#arrow-red)"/>
    <rect x="724" y="500" width="72" height="16" rx="2" fill="#f7f7f8"/>
    <text x="760" y="512" fill="#c8102e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERSION ≠</text>

    <!-- SSE events: engine -> skill panel (return path, left) -->
    <path d="M 320 648 L 208 648 Q 200 648 200 640 L 200 72 Q 200 64 208 64 L 316 64" fill="none" stroke="#0068cc" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-link)"/>
    <rect x="36" y="320" width="156" height="96" rx="2" fill="#f7f7f8"/>
    <text x="188" y="336" fill="#0068cc" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">SỰ KIỆN SSE</text>
    <text x="188" y="356" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">NODE_STARTED</text>
    <text x="188" y="372" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">NODE_COMPLETED</text>
    <text x="188" y="388" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">NODE_FAILED</text>
    <text x="188" y="408" fill="#1a0033" font-size="13" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="end">chảy về ngăn trong lúc chạy</text>

    <!-- rejected alternative link -->
    <line x1="720" y1="304" x2="800" y2="304" stroke="#66607a" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="3,4"/>
    <rect x="732" y="276" width="56" height="16" rx="2" fill="#f7f7f8"/>
    <text x="760" y="288" fill="#66607a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">THAY VÌ</text>

    <!-- ============ NODES ============ -->
    <!-- 1. skill panel -->
    <rect x="320" y="40" width="400" height="48" rx="24" fill="#f7f7f8"/>
    <rect x="320" y="40" width="400" height="48" rx="24" fill="#ffffff" stroke="#1a0033" stroke-width="1"/>
    <text x="520" y="69" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ngăn skill — người bấm Chạy</text>

    <!-- 2. POST run -->
    <rect x="320" y="128" width="400" height="96" rx="6" fill="#f7f7f8"/>
    <rect x="320" y="128" width="400" height="96" rx="6" fill="#ffffff" stroke="#1a0033" stroke-width="1"/>
    <text x="520" y="156" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">POST /api/skills/&lt;id&gt;/run</text>
    <text x="520" y="180" fill="#4f4a63" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">kiểm tham số · instantiate để bắt thiếu plugin</text>
    <text x="520" y="200" fill="#4f4a63" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">giới hạn 3 lượt đồng thời · trả {taskId}</text>

    <!-- 3. tasks row -->
    <rect x="320" y="264" width="400" height="80" rx="6" fill="#f7f7f8"/>
    <rect x="320" y="264" width="400" height="80" rx="6" fill="#ffffff" stroke="#1a0033" stroke-width="1"/>
    <text x="520" y="288" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">một hàng tasks</text>
    <text x="520" y="308" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">feature="skill" · plugin_id=""</text>
    <text x="520" y="326" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prompt = {skillId, skillVersion, params}</text>

    <!-- 4. wait SSE -->
    <rect x="320" y="384" width="400" height="64" rx="6" fill="#f7f7f8"/>
    <rect x="320" y="384" width="400" height="64" rx="6" fill="#ffffff" stroke="#1a0033" stroke-width="1"/>
    <text x="520" y="410" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">GET /api/task/wait (SSE)</text>
    <text x="520" y="430" fill="#4f4a63" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">client mở như mọi task</text>

    <!-- 5. runner (focal) -->
    <rect x="320" y="488" width="400" height="80" rx="6" fill="#f7f7f8"/>
    <rect x="320" y="488" width="400" height="80" rx="6" fill="#e100e1" fill-opacity="0.06" stroke="#e100e1" stroke-width="1.4"/>
    <text x="520" y="516" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">runner: instantiate lại từ prompt</text>
    <text x="520" y="536" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runner.ts · nhánh skill · hàm thuần, tất định</text>
    <text x="520" y="554" fill="#4f4a63" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">so skillVersion với version đang đăng ký</text>

    <!-- 6. engine -->
    <rect x="320" y="608" width="400" height="80" rx="6" fill="#f7f7f8"/>
    <rect x="320" y="608" width="400" height="80" rx="6" fill="#ffffff" stroke="#1a0033" stroke-width="1"/>
    <text x="520" y="634" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">engine delegate có sẵn</text>
    <text x="520" y="654" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">executeWorkflowViaEngine</text>
    <text x="520" y="674" fill="#1a0033" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">engine KHÔNG đổi</text>

    <!-- 7. result / error -->
    <rect x="320" y="728" width="400" height="64" rx="6" fill="#f7f7f8"/>
    <rect x="320" y="728" width="400" height="64" rx="6" fill="#ffffff" stroke="#1a0033" stroke-width="1"/>
    <text x="520" y="754" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">engine ghi kết quả vào hàng task</text>
    <text x="520" y="774" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tasks.result / tasks.error.failures[].nodeId</text>

    <!-- 8. GET runs -->
    <rect x="320" y="832" width="400" height="80" rx="6" fill="#f7f7f8"/>
    <rect x="320" y="832" width="400" height="80" rx="6" fill="#ffffff" stroke="#1a0033" stroke-width="1"/>
    <text x="520" y="858" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">GET /api/skills/runs/&lt;taskId&gt;</text>
    <text x="520" y="878" fill="#4f4a63" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">trả steps + outputs cho ngăn</text>
    <text x="520" y="896" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">steps[] = {nodeId, slot, status}</text>

    <!-- failed branch -->
    <rect x="800" y="488" width="320" height="80" rx="6" fill="#f7f7f8"/>
    <rect x="800" y="488" width="320" height="80" rx="6" fill="#c8102e" fill-opacity="0.06" stroke="#c8102e" stroke-width="1.4"/>
    <text x="960" y="514" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">task failed, không gọi engine</text>
    <text x="960" y="534" fill="#c8102e" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">SKILL_VERSION_CHANGED</text>
    <text x="960" y="554" fill="#4f4a63" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle">skill đã đổi version từ lúc bấm</text>

    <!-- rejected option (muted, struck) -->
    <rect x="800" y="264" width="320" height="80" rx="6" fill="#f7f7f8"/>
    <rect x="800" y="264" width="320" height="80" rx="6" fill="none" stroke="#66607a" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="812" y="272" width="52" height="14" rx="2" fill="none" stroke="#66607a" stroke-opacity="0.5" stroke-width="0.8"/>
    <text x="838" y="282" fill="#66607a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ĐÃ LOẠI</text>
    <g opacity="0.6">
      <text x="960" y="306" fill="#66607a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mỗi lượt một hàng workflows</text>
      <line x1="876" y1="302" x2="1044" y2="302" stroke="#66607a" stroke-width="1"/>
      <text x="960" y="324" fill="#66607a" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">+ cột provenance</text>
      <line x1="908" y1="320" x2="1012" y2="320" stroke="#66607a" stroke-width="1"/>
    </g>

    <!-- ============ LEGEND ============ -->
    <line x1="40" y1="952" x2="1120" y2="952" stroke="rgba(26,0,51,0.12)" stroke-width="0.8"/>
    <text x="40" y="980" fill="#4f4a63" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CHÚ GIẢI</text>
    <rect x="128" y="968" width="36" height="16" rx="4" fill="#ffffff" stroke="#1a0033" stroke-width="1"/>
    <text x="172" y="980" fill="#4f4a63" font-size="10" font-family="'Geist', sans-serif">bước có sẵn / mới</text>
    <rect x="304" y="968" width="36" height="16" rx="4" fill="#e100e1" fill-opacity="0.06" stroke="#e100e1" stroke-width="1.4"/>
    <text x="348" y="980" fill="#4f4a63" font-size="10" font-family="'Geist', sans-serif">chỗ rẽ nhánh</text>
    <rect x="456" y="968" width="36" height="16" rx="4" fill="#c8102e" fill-opacity="0.06" stroke="#c8102e" stroke-width="1.4"/>
    <text x="500" y="980" fill="#4f4a63" font-size="10" font-family="'Geist', sans-serif">lỗi có tên, dừng</text>
    <line x1="628" y1="976" x2="664" y2="976" stroke="#0068cc" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="672" y="980" fill="#4f4a63" font-size="10" font-family="'Geist', sans-serif">sự kiện SSE về ngăn</text>
    <rect x="816" y="968" width="36" height="16" rx="4" fill="none" stroke="#66607a" stroke-opacity="0.45" stroke-dasharray="4,3"/>
    <text x="860" y="980" fill="#4f4a63" font-size="10" font-family="'Geist', sans-serif">phương án đã loại (mờ, gạch)</text>
  </svg>
</div>
</body>
</html>
