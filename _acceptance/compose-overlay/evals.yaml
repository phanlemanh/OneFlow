# 27 eval / 16 tiêu chí — AC-1, AC-5, AC-7, AC-8, AC-9, AC-11, AC-12, AC-16 có nhiều eval.
# Hai tiêu chí cross-layer nguyên tử (cùng round): AC-11 = E14..E17 (engine, layer backend-effect);
# AC-13 = E18 (engine pytest, backend-effect) + E19 (TS vitest).
# Họ eval render plugin-repo là E2..E10 (E5a/b, E7a/b, E8a/b, E9a/b tính từng entry) — chạy
# qua guard clone-and-pytest, cố ý KHÔNG khai `paths`: code plugin nằm ngoài cây oneflow nên
# round delta không nhìn thấy nó đổi; thiếu paths = luôn chạy lại (mặc định an toàn).
# Guard clone PHẢI in commit sha của plugin repo — mỗi eval render ghi `plugin_commit_sha`
# vào evidence, và E20 đối chiếu sha đó với rev được deploy (fix gap-probe F1).
evals:
  - id: E1a
    criterion: AC-1
    executor: script
    cmd: config:executors.script.gen_abi_clean
    paths: ["config/tongflow.abi.json", "src/generated/abi/index.ts", "sdk/tongflow/_data/tongflow.abi.json", "scripts/gen-abi-types.ts"]
    expected: "exit 0; generated TS + bản copy _data khớp ABI đã commit (git diff --exit-code)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E1b
    criterion: AC-1
    executor: script
    cmd: config:executors.script.abi_python_gen_clean
    paths: ["config/tongflow.abi.json", "sdk/tongflow/models/compose_overlay.py", "sdk/tongflow/node_slots.py", "sdk/tongflow/gen_models.py", "sdk/tongflow/gen_node_slots.py", "scripts/abi/check-python-gen-clean.sh"]
    expected: "exit 0; chạy lại gen_models.py + gen_node_slots.py rồi git diff --exit-code sdk/tongflow/models sdk/tongflow/node_slots.py — models Python đã commit khớp ABI, có ComposeOverlayInput/Output + COMPOSE_OVERLAY"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.overlay_diacritics
    expected: "exit 0; pangram phủ đủ dấu Việt (hoa+thường): ảnh khớp golden pixel-for-pixel; điểm so hai modality là CANVAS RGBA trước composite (một canvas dùng chung); frame video kiểm qua pipeline lossless trong test (frame PNG/codec lossless) khớp golden — không so trên frame lossy (F2)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, plugin_commit_sha]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.overlay_multiline
    expected: "exit 0; \\n xuống dòng đúng, max_width ngắt từ đúng golden, không tràn khung"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, plugin_commit_sha]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.overlay_price_tag
    expected: "exit 0; chuỗi giá 1.999.000₫ in verbatim từng ký tự trên box bg/padding/radius khớp golden"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, plugin_commit_sha]

  - id: E5a
    criterion: AC-5
    executor: script
    cmd: config:executors.script.overlay_logo
    expected: "exit 0; logo PNG alpha đặt đúng vị trí/anchor/scale giữ tỷ lệ, blend khớp golden"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, plugin_commit_sha]

  - id: E5b
    criterion: AC-5
    executor: script
    cmd: config:executors.script.overlay_logo_missing
    expected: "exit 0; op logo mà input logo vắng → success:false + error nêu rõ thiếu logo, không crash"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, plugin_commit_sha]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.overlay_safe_zone
    expected: "exit 0; op lấn vùng cấm bị clamp bbox vào trong, op không lấn giữ NGUYÊN toạ độ; clamp tất định, không phụ thuộc thứ tự ops; kiểm cả preset lẫn custom insets"
    evidence_required: [run_id, exit_code, verifier, verified_at, output, plugin_commit_sha]

  - id: E7a
    criterion: AC-7
