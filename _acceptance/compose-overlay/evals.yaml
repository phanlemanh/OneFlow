    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E23
    criterion: AC-16
    executor: judgment
    question: "So capture 6 state với design-of-record (evidence/design/reference/source/): node compose-overlay + ops-editor có khớp cả 6 state của ma trận (empty / ops-image / ops-video / op-form / error / running) không? Có nhìn như người nhà của các node transfer hiện có (shell, spacing, states)? Có gì phá ngôn ngữ thiết kế workspace?"
    inputs: ["evidence/design/captures/state-1-empty.png", "evidence/design/captures/state-2-ops-image.png", "evidence/design/captures/state-3-ops-video.png", "evidence/design/captures/state-4-op-form.png", "evidence/design/captures/state-5-error.png", "evidence/design/captures/state-6-running.png", "evidence/design/reference/source/manifest.json"]
    expected: "Panel đồng thuận node đạt ngôn ngữ thiết kế workspace; UNCERTAIN → human quyết ở Cổng 2"
    evidence_required: [run_id, verifier, verified_at, output]
