<!doctype html>
<html lang="vi">
<head>

<title>compose-overlay — state 1: empty</title>
<link rel="stylesheet" href="styles.css">

<body>
<div class="node">

  <span class="handle-label" style="top:90px; left:12px">in:text</span>
  <span class="handle in" style="top:136px"></span>
