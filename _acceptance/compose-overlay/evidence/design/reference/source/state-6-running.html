<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>compose-overlay — state 6: running (shell loading overlay)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="node">
  <span class="rotate-border"></span>
  <span class="handle in" style="top:56px"></span>
  <span class="handle in" style="top:96px"></span>
  <span class="handle in" style="top:136px"></span>
  <span class="handle out" style="top:76px"></span>
  <span class="handle out" style="top:116px"></span>

  <div class="node-header">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M7 21h10M12 17v4"/></svg>
    Dán chữ / logo
    <span class="spacer"></span>
    <span class="menu">⋯</span>
  </div>

  <div class="plugin-select">
    <div class="select">oneflow-modal-compose-overlay</div>
  </div>

  <div class="ops">
    <div class="ops-label">Ops · media: video</div>
    <div class="op-row">
      <span class="op-type">GIÁ</span>
      <span class="op-summary">"{text}" · nền đỏ · 0.5, 0.82</span>
      <span class="op-time">suốt video</span>
      <span class="op-act">✎ ✕</span>
    </div>
  </div>

  <div class="execute">
    <button class="btn-primary" type="button" disabled>✦ Dán lên media</button>
  </div>

  <div class="overlay">
    <div class="progress">Đang dán overlay…</div>
    <div class="spinner"></div>
    <div class="progress">16s</div>
    <button class="cancel" type="button" title="Cancel execution">✕ Huỷ</button>
  </div>
</div>
</body>
</html>
