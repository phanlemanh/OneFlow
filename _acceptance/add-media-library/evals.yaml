schema_version: 1
feature_slug: add-media-library

# T3. Bảy criterion mang tag (cross-layer) — AC-1, AC-3, AC-5, AC-6, AC-9, AC-12,
# AC-13 — vì When/Then của chúng đi qua server (đọc kho khoá, gọi REST, ghi kho
# file, ghi bản đồ node). Mỗi criterion đó mang CẢ một eval `layer: backend-effect`
# chứng minh nửa server trên nonce riêng, LẪN một ui-check khẳng định dấu vết
# server-derived trên màn hình. ui-check một mình không bao giờ đủ cho criterion
# xuyên lớp.
#
# Mọi test chạy với MỘT MÁY CHỦ GIẢ CỤC BỘ dựng đúng hình dạng hợp đồng thật của
# media-library (đọc từ packages/contracts/src/ ngày 19/08) — không eval nào gọi
# mạng ra ngoài, nên vòng verify chạy được cả khi không có instance library.
#
# `paths` khai trên mọi eval máy/ui để round sau carry-forward được phần diff không
# chạm. Suite commands luôn chạy lại.
#
# LUẬT TAG (cross-layer) dùng trong hồ sơ này, viết ra để khỏi bị đọc là bất nhất:
# tag đánh dấu criterion cần CẢ bằng chứng lớp UI LẪN bằng chứng lớp server. AC-11
# và AC-14 chạy hoàn toàn phía server nên KHÔNG mang tag — eval của chúng là
# test/script, không có nguy cơ "ui-check một mình gánh criterion xuyên lớp".
#
# NGOÀI 29 eval này, mỗi vòng verify còn chạy bộ `feature_loop.suite_keys` của repo:
# build+typecheck · lint · unit · sdk pytest · verify:plugins · gen_abi_clean. Người
# ký ở Cổng 1 nên đọc 29 eval là phần RIÊNG của feature, không phải toàn bộ cổng.

evals:
  # ---------- A. Không phụ thuộc cứng (bảo đảm #2) ----------
  - id: E1
    criterion: AC-1
    layer: backend-effect
    executor: test
    cmd: config:executors.test.unit_aml_config
    paths: ["src/lib/media-library/config.server.ts", "src/lib/settings/env-store.server.ts"]
    expected: "exit 0; với kho khoá thiếu MEDIA_LIBRARY_URL, kết quả trả về nêu ĐÍCH DANH chuỗi 'MEDIA_LIBRARY_URL' (assert trên nội dung chuỗi, không phải trên một boolean), thiếu cả hai thì nêu CẢ HAI tên. NỬA ĐÀN ÁP — nửa gánh việc: với cả hai biến đã đặt, cùng đường code đó KHÔNG được báo thiếu; một hàm luôn-trả-thiếu sẽ qua được vế xanh và chính là lỗi bị canh. (Vế 'không lời gọi mạng nào' KHÔNG đo ở đây — spy fetch trong test đơn vị của config.server là hằng đúng vì nơi đó vốn không có fetch; vế đó do E26 gánh, chạy qua route)"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E2
    criterion: AC-1
    executor: ui-check
    steps:
      - "Mở {url}/proto/add-media-library?state=missing-config → chụp _acceptance/add-media-library/evidence/E2-step1.png"
      - "Assert: tên biến còn thiếu hiện NGUYÊN VĂN trên màn hình (đọc được bằng mắt trong ảnh), không phải câu chung chung 'chưa cấu hình dịch vụ'"
    expected: "khung hình nêu đúng tên biến còn thiếu; một thông điệp không chứa tên biến là FAIL kể cả khi nó lịch sự hơn"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E3
    criterion: AC-2
    executor: script
    cmd: config:executors.script.aml_no_boot_dependency
    paths: ["src/lib/media-library/**", "src/app/**", "src/components/workspace/**"]
    expected: "exit 0; quét đồ thị import THẬT (parse AST, phân giải specifier thành ĐƯỜNG DẪN nên import tương đối `../../lib/media-library/...` bị bắt y như alias `@/`; allow-list là danh sách file CHÍNH XÁC chứ không phải tiền tố tên file tự miễn trừ) và khẳng định module src/lib/media-library/** CHỈ được nhập bởi các file đã khai — không layout, không page, không instrumentation, không provider toàn cục. RĂNG: chạy lại trên fixture có thêm một dòng import từ src/app/workspace/page.tsx thì guard PHẢI exit khác 0 và nêu đúng đường dẫn vi phạm; một guard chỉ grep tên package sẽ xanh trên fixture đó"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-2
    executor: ui-check
    steps:
      - "Kho khoá RỖNG; mở {url}/workspace → chụp _acceptance/add-media-library/evidence/E4-step1.png"
      - "Thêm một node KHÁC (add ảnh) từ bảng chọn → chụp _acceptance/add-media-library/evidence/E4-step2.png"
      - "Assert: không banner lỗi toàn cục, không toast, console không có lỗi chưa bắt"
    expected: "studio dùng được bình thường khi chưa hề cấu hình library; ĐIỀU KHIỂN DƯƠNG trước: khung hình phải cho thấy node mới THẬT SỰ được thêm, nếu không thì một trang trắng cũng không có lỗi"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  # ---------- B. Tìm trong kho ----------
  - id: E5
    criterion: AC-3
    layer: backend-effect
    executor: test
    cmd: config:executors.test.unit_aml_client
    paths: ["src/lib/media-library/client.server.ts", "src/lib/media-library/types.ts"]
    expected: "exit 0; máy chủ giả GHI LẠI request thật và test assert từng phần: method POST, đường dẫn /v1/search, header Authorization đúng chuỗi 'Bearer <key>' (khớp regex neo ^Bearer , đúng như auth.ts của library), body có intent người dùng gõ, media_type='video', limit<=20. NỬA ĐÀN ÁP: máy chủ giả trả 401 khi thiếu header — một adapter quên header phải làm test ĐỎ, không phải trả mảng rỗng lặng lẽ"
    evidence_required: [run_id, exit_code, verifier, verified_at]

