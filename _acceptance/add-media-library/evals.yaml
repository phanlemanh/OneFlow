    expected: "trạng thái đang-nạp phân biệt được với đang-chọn, thẻ đang nạp không bấm lại được, VÀ khung 2 cho thấy chặng SAU khi nạp (clip đã ở kho file, node video mới) chứ không phải danh sách trước khi nạp. Round 2 FAIL đúng ở đây: step 2 trỏ state=results — màn hình TRƯỚC khi nạp — nên chặng mà tiêu chí này tồn tại để chứng minh chưa từng được chụp. E15 gánh nửa server chứng minh bytes thật sự về kho"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E17
    criterion: AC-10
    executor: test
    cmd: config:executors.test.unit_aml_import
    paths: ["src/lib/media-library/import.server.ts"]
    expected: "exit 0; urls.original dạng http:// (khi cấu hình KHÔNG phải localhost) bị từ chối kèm lý do gọi đúng tên; phản hồi vượt trần kích thước bị cắt và báo; phản hồi treo quá hạn chờ bị huỷ — ĐO THẬT: stub giữ body mở (hangBytes), MEDIA_LIBRARY_DOWNLOAD_TIMEOUT_MS hạ deadline xuống 300ms, assert kết thúc dưới 10s và kho KHÔNG còn file nào; nửa đàn áp: cùng deadline đó một body hoàn tất vẫn phải nạp được. PHẠM VI: AC-10 đòi CẮT, không đòi gọi đúng tên nguyên nhân — việc treo hiện báo LOCAL_FAILURE là lỗi đã xác nhận, triage xếp NGOÀI hợp đồng, để Cổng 2. ĐIỀU KHIỂN DƯƠNG bắt buộc trong cùng test: một URL https dưới trần PHẢI thành công — nếu không, một hàm từ chối tất cả cũng qua được cả ba vế"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E18
    criterion: AC-11
    executor: test
    cmd: config:executors.test.unit_aml_ext
    paths: ["src/lib/media-library/import.server.ts", "src/app/api/uploads/[...path]/route.ts"]
    expected: "exit 0; ba bậc suy đuôi chạy đúng thứ tự: URL có '.webm' → key đuôi webm; URL không đuôi + Content-Type 'video/mp4' → mp4; không đuôi + Content-Type vô nghĩa → mp4 mặc định. Và với key sinh ra, bảng Content-Type của /api/uploads phải trả kiểu phát được — ĐO THẬT trong extension-serving.server.test.ts: lưu bytes qua saveFile rồi GỌI handler GET của route uploads và đọc header Content-Type; nửa đàn áp: một đuôi mà thang từ chối (.svg) không được phục vụ như video, và key chưa từng ghi phải 404. NỬA ĐÀN ÁP — nửa gánh việc: URL '.webm' KHÔNG được thành .mp4; một cài đặt luôn gán mp4 qua được hai bậc sau và hỏng đúng bậc đầu"
    evidence_required: [run_id, exit_code, verifier, verified_at]

