  # ---------- D. Nạp bytes (bảo đảm #1) ----------
  - id: E15
    criterion: AC-9
    layer: backend-effect
    executor: test
    cmd: config:executors.test.unit_aml_import
    paths: ["src/lib/media-library/import.server.ts", "src/lib/file/file-utils.ts", "src/lib/file/storage.server.ts"]
    expected: "exit 0; trên nonce riêng: adapter gọi GET /v1/assets/:id (máy chủ giả ghi nhận), tải bytes từ urls.original, và file_key sinh ra ĐỌC LẠI ĐƯỢC từ kho với sha256 TRÙNG sha256 của bytes máy chủ giả phát ra — round-trip THẬT trong import-roundtrip.server.test.ts: TONGFLOW_DATA_DIR trỏ thư mục tạm, driver production ghi file thật, readUploadFileByFileKey đọc lại bằng đường code KHÁC. GIỚI HẠN đã khai: chỉ phủ driver đĩa cục bộ; driver của cloud shell (@ext/storage-driver) không được phủ ở đây. NỬA ĐÀN ÁP — nửa gánh việc: khi urls.original trả 404 thì KHÔNG file_key nào được tạo và KHÔNG file rỗng nào bị bỏ lại trong kho; một cài đặt lưu trước-kiểm-sau sẽ đỏ đúng ở đây"
    evidence_required: [run_id, exit_code, verifier, verified_at]

