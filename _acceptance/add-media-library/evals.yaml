  # ---------- C. Thẻ Media Card (bảo đảm #3) ----------
  - id: E12
    criterion: AC-7
    executor: script
    cmd: config:executors.script.aml_no_domain_vocab
    paths: ["src/**"]
    expected: "exit 0; PHẠM VI QUÉT SUY TỪ CỬA SỔ DIFF merge-base(origin/main,HEAD)..HEAD — mọi file thêm hoặc sửa dưới src/ — chứ KHÔNG từ một danh sách tên file viết tay (một danh sách tay không bao giờ chứa file mà impl chưa đặt tên); guard khẳng định cửa sổ KHÔNG RỖNG trước, vì cửa sổ rỗng làm mọi lời khai vắng-mặt thành vô nghĩa. Trong phạm vi đó, đỏ khi thấy: (a) một trong 18 chuỗi từ vựng lĩnh vực (noi-that, ngoai-canh, flycam, tien-ich, cong-truong, duong-pho, du-an, phan-khu, cung-truc, cung-layout, cung-tang, cung-toa, dung-can, render-3d, scale-model, real-model, full-noi-that, co-ban); (b) MA TRẬN 8 TRƯỜNG — khai báo union đóng cho bất kỳ trường nào trong provenance, scene_kind, entity.kind, entity.specificity, energy, interior_state, license_label, slot_role (một lượt grep RIÊNG cho từng trường và từng literal, không dùng alternation gộp; con số in ra suy từ ${#FIELDS[@]}/${#VOCAB[@]} chứ không viết cứng; phép kiểm union khớp CẢ nháy đơn lẫn nháy kép). RĂNG: chạy lại trên bản sao có cắm scene_kind === 'noi-that' vào một file MỚI chưa từng có tên trong bất kỳ danh sách nào của hồ sơ này, guard PHẢI exit khác 0 và in đúng đường dẫn + số dòng; một guard neo vào danh sách tay sẽ xanh trên fixture đó và đó chính là lỗ hổng bị bịt"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-7
    executor: test
    cmd: config:executors.test.unit_aml_node
    paths: ["src/components/workspace/nodes/add/media-card-list.tsx", "src/lib/media-library/types.ts"]
    expected: "exit 0; thẻ mang provenance='generated:acme@deadbeef' (dạng MỞ của hợp đồng) và scene_kind='mot-loai-chua-tung-co' vẫn render đủ caption + ảnh thu nhỏ, không throw, không hiện 'undefined'. Thẻ entity=null cũng render bình thường. NỬA ĐÀN ÁP: một cài đặt dùng union đóng sẽ ném hoặc bỏ trắng trên chính hai giá trị đó"
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E14
    criterion: AC-8
    executor: test
    cmd: config:executors.test.unit_aml_node
    paths: ["src/components/workspace/nodes/add/media-card-list.tsx"]
    expected: "exit 0; thẻ có license_label='Phối cảnh 3D' thì CHUỖI ĐÓ có mặt trong cây render (assert nội dung, không assert 'có một chip nào đó'). NỬA ĐÀN ÁP: thẻ KHÔNG có license_label thì không render chip rỗng — nhãn bắt buộc-khi-có không được biến thành ô trống luôn-hiện"
