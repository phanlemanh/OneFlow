      - "Assert: khung 1 có dải nói rõ kết quả không xếp hạng theo ngữ nghĩa; khung 2 KHÔNG có dải đó"
    expected: "hai khung hình khác nhau nhìn thấy được; một 200 kèm cảnh báo không được trình y hệt một 200 sạch"
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E10
    criterion: AC-6
    layer: backend-effect
    executor: test
    cmd: config:executors.test.unit_aml_client
    paths: ["src/lib/media-library/client.server.ts", "src/lib/media-library/errors.ts"]
    expected: "exit 0; MA TRẬN TOÀN PHẦN tám ca, số assert BẰNG số ca: 401 · 403 (error='forbidden: cần scope search') · 400 (error='bad_request') · 404 · 500 thân trần · 501 (error='not_implemented') · thân trả về là HTML không phải JSON · đứt mạng (fetch reject). Mỗi ca cho ra một mã lỗi RIÊNG của OneFlow, assert từng phần tử chứ không assert 'có lỗi'. Vế bắt buộc thứ hai: KHÔNG ca nào trong tám ca cho ra mã kệ-mỏng — đây chính là kịch bản 501-đọc-nhầm-thành-kho-rỗng. RĂNG — trường hợp quyết định: một 403 mà thân câu tiếng Việt bị thay bằng chuỗi vô nghĩa PHẢI vẫn phân loại đúng là thiếu-scope, vì phân loại đọc mã HTTP + trường error chứ không regex câu chữ; một adapter regex vào 'cần scope' sẽ đỏ đúng ở đây"
    evidence_required: [run_id, exit_code, verifier, verified_at]

