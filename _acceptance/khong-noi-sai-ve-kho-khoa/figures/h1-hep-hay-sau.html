<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H1 · Hẹp hay sâu — khong-noi-sai-ve-kho-khoa</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f7f7f8;
      --color-ink:    #1a0033;
      --color-muted:  #4f4a63;
      --color-accent: #e100e1;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Lora', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">H1 · so sánh hai kiến trúc · Cổng 1 · khong-noi-sai-ve-kho-khoa</p>
    <h1>Hẹp bây giờ, sâu thành hồ sơ sau — PUT ghi đè toàn phần</h1>

    <svg viewBox="0 0 1200 664" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f4a63"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e100e1"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0068cc"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f7f8"/>

      <!-- ===== Column heads ===== -->
      <text x="40" y="48" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HÔM NAY + VÒNG NÀY</text>
      <text x="40" y="72" fill="#1a0033" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Hẹp — hợp nhất ở client, PUT ghi đè toàn phần</text>

      <text x="640" y="48" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">HỒ SƠ KẾ</text>
      <text x="640" y="72" fill="#1a0033" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Sâu — hợp nhất ở server</text>

      <line x1="600" y1="32" x2="600" y2="568" stroke="rgba(26,0,51,0.12)" stroke-width="0.8"/>

      <!-- ===== Arrows (drawn before nodes) ===== -->
      <!-- LEFT column -->
      <!-- 1 · client ĐỌC (HTTP) -->
      <line x1="204" y1="160" x2="204" y2="248" stroke="#0068cc" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- 1 · server readEnvStore() -->
      <line x1="204" y1="304" x2="204" y2="392" stroke="#4f4a63" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- kho hiện có trả về client (dashed = dữ liệu trả về) -->
      <line x1="300" y1="248" x2="300" y2="160" stroke="#4f4a63" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- 3 · PUT thân đầy đủ (HTTP) -->
      <line x1="396" y1="160" x2="396" y2="248" stroke="#0068cc" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- 4 · ghi đè toàn phần -->
      <line x1="396" y1="304" x2="396" y2="392" stroke="#4f4a63" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- RIGHT column -->
      <!-- PUT đặt / xoá khoá (HTTP) -->
      <line x1="900" y1="160" x2="900" y2="248" stroke="#0068cc" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- server ĐỌC kho -->
      <line x1="852" y1="304" x2="852" y2="392" stroke="#4f4a63" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- server GHI kho -->
      <line x1="948" y1="304" x2="948" y2="392" stroke="#4f4a63" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Nodes ===== -->
      <!-- LEFT: Client (input treatment) -->
      <rect x="160" y="104" width="280" height="56" rx="6" fill="#f7f7f8"/>
      <rect x="160" y="104" width="280" height="56" rx="6" fill="rgba(79,74,99,0.10)" stroke="#66607a" stroke-width="1"/>
      <text x="300" y="128" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="300" y="146" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">2 · hợp nhất ở client: khoá cũ + khoá mới</text>

      <!-- LEFT: Server (backend treatment) -->
      <rect x="160" y="248" width="280" height="56" rx="6" fill="#f7f7f8"/>
      <rect x="160" y="248" width="280" height="56" rx="6" fill="#ffffff" stroke="#1a0033" stroke-width="1"/>
      <text x="300" y="272" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Server</text>
      <text x="300" y="290" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 · saveEnvStore(env) — thay trọn kho</text>

      <!-- LEFT: Kho (store treatment) -->
      <rect x="160" y="392" width="280" height="56" rx="6" fill="#f7f7f8"/>
      <rect x="160" y="392" width="280" height="56" rx="6" fill="rgba(26,0,51,0.05)" stroke="#4f4a63" stroke-width="1"/>
      <text x="300" y="416" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kho (tệp)</text>
      <text x="300" y="434" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">env-store · ok | absent | unreadable</text>

      <!-- RIGHT: Client -->
      <rect x="760" y="104" width="280" height="56" rx="6" fill="#f7f7f8"/>
      <rect x="760" y="104" width="280" height="56" rx="6" fill="rgba(79,74,99,0.10)" stroke="#66607a" stroke-width="1"/>
      <text x="900" y="128" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="900" y="146" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chỉ gửi thay đổi · không đọc trước</text>

      <!-- RIGHT: Server -->
      <rect x="760" y="248" width="280" height="56" rx="6" fill="#f7f7f8"/>
      <rect x="760" y="248" width="280" height="56" rx="6" fill="#ffffff" stroke="#1a0033" stroke-width="1"/>
      <text x="900" y="272" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Server</text>
      <text x="900" y="290" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ĐỌC → HỢP NHẤT → GHI, trong một lượt</text>

      <!-- RIGHT: Kho -->
      <rect x="760" y="392" width="280" height="56" rx="6" fill="#f7f7f8"/>
      <rect x="760" y="392" width="280" height="56" rx="6" fill="rgba(26,0,51,0.05)" stroke="#4f4a63" stroke-width="1"/>
      <text x="900" y="416" fill="#1a0033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kho (tệp)</text>
      <text x="900" y="434" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">env-store · ok | absent | unreadable</text>

      <!-- ===== Arrow labels (masked, 6–10px off the stroke) ===== -->
      <!-- left of x=204, Client→Server -->
      <rect x="140" y="196" width="56" height="16" rx="2" fill="#f7f7f8"/>
      <text x="194" y="208" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">1 · ĐỌC</text>
      <!-- left of x=204, Server→Kho -->
      <rect x="76" y="340" width="120" height="16" rx="2" fill="#f7f7f8"/>
      <text x="194" y="352" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">1 · readEnvStore()</text>
      <!-- right of x=300 (dashed return) -->
      <rect x="308" y="196" width="76" height="16" rx="2" fill="#f7f7f8"/>
      <text x="312" y="208" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">KHO HIỆN CÓ</text>
      <!-- right of x=396, Client→Server -->
      <rect x="404" y="196" width="124" height="16" rx="2" fill="#f7f7f8"/>
      <text x="408" y="208" fill="#0068cc" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">3 · PUT THÂN ĐẦY ĐỦ</text>
      <!-- right of x=396, Server→Kho -->
      <rect x="404" y="340" width="128" height="16" rx="2" fill="#f7f7f8"/>
      <text x="408" y="352" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">4 · GHI ĐÈ TOÀN PHẦN</text>

      <!-- right column -->
      <rect x="908" y="196" width="136" height="16" rx="2" fill="#f7f7f8"/>
      <text x="912" y="208" fill="#0068cc" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PUT · ĐẶT / XOÁ KHOÁ</text>
      <rect x="812" y="340" width="32" height="16" rx="2" fill="#f7f7f8"/>
      <text x="842" y="352" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">ĐỌC</text>
      <rect x="956" y="340" width="32" height="16" rx="2" fill="#f7f7f8"/>
      <text x="960" y="352" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">GHI</text>

      <!-- ===== Known limit (focal, chữ nói rõ) ===== -->
      <rect x="160" y="480" width="280" height="64" rx="6" fill="#f7f7f8"/>
      <rect x="160" y="480" width="280" height="64" rx="6" fill="rgba(225,0,225,0.08)" stroke="#e100e1" stroke-width="1.4"/>
      <text x="172" y="500" fill="#9c009c" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.12em">KNOWN LIMIT CÓ TÊN · NGOÀI PHẠM VI 1</text>
      <text x="172" y="526" fill="#1a0033" font-size="11" font-weight="600" font-family="'Geist', sans-serif">PUT {env:{}} không cờ vẫn xoá kho lành</text>

      <!-- ===== Right-column note ===== -->
      <text x="900" y="512" fill="#4f4a63" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Lora', serif" text-anchor="middle">Không lượt đọc client nào là load-bearing.</text>
      <text x="900" y="532" fill="#66607a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hợp nhất về server → đổi hợp đồng dây, chạm mọi biểu mẫu</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="592" x2="1160" y2="592" stroke="rgba(26,0,51,0.12)" stroke-width="0.8"/>
      <text x="40" y="608" fill="#4f4a63" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <line x1="40" y1="628" x2="68" y2="628" stroke="#0068cc" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="76" y="632" fill="#4f4a63" font-size="9" font-family="'Geist', sans-serif">HTTP client → server</text>

      <line x1="240" y1="628" x2="268" y2="628" stroke="#4f4a63" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="276" y="632" fill="#4f4a63" font-size="9" font-family="'Geist', sans-serif">I/O tệp server → kho</text>

      <line x1="440" y1="628" x2="468" y2="628" stroke="#4f4a63" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="476" y="632" fill="#4f4a63" font-size="9" font-family="'Geist', sans-serif">dữ liệu trả về client</text>

      <rect x="620" y="620" width="24" height="12" rx="2" fill="rgba(225,0,225,0.08)" stroke="#e100e1" stroke-width="1"/>
      <text x="652" y="632" fill="#4f4a63" font-size="9" font-family="'Geist', sans-serif">Known limit có tên — chữ nằm trong ô, không chỉ màu</text>

      <text x="1160" y="632" fill="#66607a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">AC-1 · AC-7 · NGOÀI PHẠM VI MỤC 1</text>
    </svg>
  </div>
</body>
</html>
