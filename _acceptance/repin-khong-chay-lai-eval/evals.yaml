schema_version: 1
feature_slug: repin-khong-chay-lai-eval

# T2, chín tiêu chí. KHÔNG criterion nào (cross-layer): mọi When/Then chạy ở lớp script,
# sổ chạy JSONL và cấu hình.
#
# BA LUẬT ĐO CỦA VÒNG NÀY — cả ba rút từ lỗi CÓ THẬT của ba vòng trước trong phiên:
#
# 1. Bất biến đếm phải PHÂN BIỆT ĐƯỢC CẤU HÌNH SAI. Vòng trước ship `kê == đo + bỏ qua`
#    — mỗi phần tử rơi vào đúng một nhánh nên nó hằng-đúng. Ở đây con số chịu lực là
#    "dòng tính được > 0": một script trơ (xếp tất cả vào ông bà) in đúng mọi số khác
#    nhưng KHÔNG in được số này.
#
# 2. Vế xanh trên vật RỖNG không chứng minh gì. Trên kho hôm nay 33/33 dòng repin thiếu
#    `prev_sha`, nên nhánh chính của hàng rào chưa từng chạy trên dữ liệu thật — E6 đòi
#    số tính được > 0, và điều đó chỉ đạt được sau khi chế độ `write` ghi một dòng thật.
#
# 3. Tập, không phải số. E4 so TẬP id (bị chạm và không bị chạm) vì một bộ giao trả về
#    cả tập cũng in đúng con số đếm.

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.rkce_write_teeth
    paths: ["scripts/ci/check-repin-eval-coverage.sh"]
    expected: >-
      exit 0 và stdout `CASE write-thieu-verified-commit: PASS`. Ca này chạy chế độ
      `write` trên một hồ sơ fixture KHÔNG có `verified_commit` và đòi nó thoát KHÁC 0
      nêu đích danh hồ sơ — chứ không lặng lẽ ghi một dòng repin thiếu `prev_sha`. Đây
      là AC chịu lực nhất của hồ sơ: nghi thức ghim nằm trong kit mà kho không sở hữu,
      nên nếu kho chỉ ĐỌC thì không dòng repin mới nào có `prev_sha` và hàng rào trơ
      vĩnh viễn. Đối chứng dương nằm ở ca `healthy` của E8: `write` trên hồ sơ đủ dữ
      liệu phải ghi được dòng có `prev_sha` đúng bằng `verified_commit` cũ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.rkce_newlines_have_prev
    paths:
      - "scripts/ci/check-repin-eval-coverage.sh"
      - "_acceptance"
    expected: >-
      exit 0 và stdout ghim số dòng repin MỚI so với `origin/main` cùng số dòng thiếu
      `prev_sha` trong đó (kỳ vọng 0). Luật là DELTA, cùng khuôn chế độ `orphans` của
      hàng rào icon: 33 dòng lịch sử ở base KHÔNG bị đòi, chỉ dòng thêm mới. Đòi tuyệt
      đối là làm CI đỏ vì quá khứ. Chiều đỏ: ca `ong-ba` của E8 chứng minh dòng cũ vẫn
      xanh, và một dòng MỚI thiếu `prev_sha` phải đỏ nêu đích danh slug + `run_id`.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.rkce_paths_law
    paths: ["scripts/ci/check-repin-eval-coverage.sh"]
    expected: >-
      exit 0 và stdout in MA TRẬN TOÀN PHẦN bốn hình dạng × hai chiều = **tám dòng**:
      đường dẫn trần · glob (`scripts/**`) · thư mục trần (`_acceptance`) · tiền tố có
      `*`, mỗi hình dạng một ca CHẠM và một ca KHÔNG CHẠM, mỗi dòng nêu mục `paths` nào
      khớp file nào. Hình dạng thứ ba là chỗ đau: chính `evals.yaml` của hồ sơ này khai
      `paths: ["_acceptance"]`, và minimatch thuần chỉ khớp đúng chuỗi ấy — mọi mục kiểu
      thư mục trong 357 eval đang khai `paths` sẽ thành KHÔNG BAO GIỜ bị chạm, và hàng
      rào under-report ở đúng lớp hồ sơ đông nhất mà vẫn xanh.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.rkce_plan
    paths: ["scripts/ci/check-repin-eval-coverage.sh"]
    expected: >-
      exit 0 và stdout in HAI TẬP id — bị chạm và không bị chạm — cho một fixture CÓ TÊN
      với tập eval biết trước và cặp sha biết trước; so bằng phép so tập, không phải
      chuỗi-có-mặt. Và một ca thứ hai: thêm ĐÚNG MỘT file vào diff phải làm ĐÚNG MỘT id
      chuyển từ tập sau sang tập trước. Chỉ đếm số thì một bộ giao trả về CẢ TẬP cũng in
      đúng con số ấy và vẫn thoả luật "eval không khai `paths` luôn có mặt".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.rkce_check
    paths:
      - "scripts/ci/check-repin-eval-coverage.sh"
      - "_acceptance"
    expected: >-
      exit 0 trên kho thật. `check` đọc mọi hồ sơ đã ký; với mỗi dòng repin CÓ `prev_sha`
      thì tính `git diff prev_sha..sha`, giao với `paths` từng eval theo luật ở AC-3, rồi
      đòi mỗi eval bị chạm có một dòng `{"kind":"eval","run_id":<cùng run_id>,"eval":<id>}`
      trong CHÍNH `run-log.jsonl` của hồ sơ. Hình dạng và đường dẫn ấy khai ở đây TRƯỚC
      khi viết mã: một bộ đọc tra sai chỗ vẫn làm mọi fixture tự dựng xanh, và bằng chứng
      vẫn nói "chạy trên kho thật, exit 0". Chiều đỏ ở ca `nuot-eval` của E8.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.rkce_check
    paths:
      - "scripts/ci/check-repin-eval-coverage.sh"
      - "_acceptance"
    expected: >-
      exit 0 và stdout ghim NĂM số độc lập: hồ sơ đã quét · dòng repin đọc được · **dòng
      tính được (phải > 0)** · dòng ông bà · eval bị nuốt. Con số thứ ba là ô đo thật sự:
      bốn số kia đều thoả bởi một script chỉ đếm dòng rồi xếp TẤT CẢ vào nhánh ông bà
      (hôm nay ông bà = tổng = 33, nuốt = 0), nên chúng không phân biệt được "phát hiện
      `prev_sha` chạy đúng" với "phát hiện `prev_sha` là no-op". `> 0` chỉ đạt được sau
      khi chế độ `write` đã ghi ít nhất một dòng thật trên nhánh này — tức nó buộc AC-1
      phải hoạt động chứ không chỉ tồn tại. Dùng chung lệnh với E5; tách criterion vì
      "in đủ năm số, số thứ ba > 0" là lời hứa riêng với người đọc log CI.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.rkce_readers_bytewise
    paths:
      - "scripts/ci/check-repin-eval-coverage.sh"
      - "scripts/recheck-evidence.cjs"
      - "scripts/pre-merge-check.sh"
    expected: >-
      exit 0. Chế độ `readers` chạy `pre-merge-check.sh . --base origin/main` HAI lượt
      trên cây thật — một với một dòng repin có `prev_sha`, một với dòng ấy đã gỡ trường
      đó — rồi đòi đầu ra hai lượt GIỐNG NHAU TỪNG BYTE, và in số violation của cả hai.
      Đo QUAN HỆ trước/sau, không phải "cả hai chấp nhận" trên kho dùng-rồi-bỏ: bên đọc
      bỏ qua trường lạ nên "chấp nhận" là hằng-đúng và không nội dung `prev_sha` nào làm
      nó đỏ được. ĐỐI CHỨNG DƯƠNG bắt buộc, chứng minh phép thử thấy được đỏ: **gỡ khoá
      `sha`** khỏi dòng repin phải làm cả hai bên đọc ĐỎ. Bản đầu của hợp đồng khai chiều
      đỏ là "ghi `prev_sha` sai kiểu" — tự mâu thuẫn với chính tiền đề của feature.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.rkce_teeth
    paths: ["scripts/ci/check-repin-eval-coverage.sh"]
    expected: >-
      exit 0 và ĐỦ TÁM dòng `CASE <tên>: PASS` cùng chốt `OK: 8/8 ca` — `healthy` (đối
      chứng dương, và cũng chứng minh `write` ghi được `prev_sha` đúng bằng
      `verified_commit` cũ) · `nuot-eval` (đỏ, nêu đích danh slug + `run_id` + id eval) ·
      `da-chay-lai` (XANH — đối chứng phân biệt "bắt được việc nuốt" với "đỏ mọi thứ") ·
      `ong-ba` (dòng cũ không `prev_sha` → xanh và được đếm) · `khong-khai-paths` (eval
      không khai `paths` → LUÔN tính là chạm) · `paths-thu-muc-tran` · `paths-glob` ·
      `write-thieu-verified-commit`. Mọi ca dựng trên kho git dùng-rồi-bỏ (`mktemp -d` +
      `git init`), KHÔNG chạm cây thật — vòng trước một ca ghi vật thăm dò vào cây thật
      và gây đua với ô đo anh em chạy song song. Lượt `--case` lẻ in `PARTIAL: n/8` và
      KHÔNG in `OK:`; tên ca lạ → thoát 2.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.rkce_resign_wave
    expected: >-
      exit 0 — không hồ sơ đã ký NÀO KHÁC còn mang bằng chứng có trước code của nhánh
      này. Đo 02/09 bằng mô phỏng: chạm vùng gated làm **3** hồ sơ hoá ôi (`scripts/ci/`
      → 3 · `scripts/acceptance/` → 4 · `scripts/plugins/` → 3), nên vòng này kèm một sự
      kiện re-pin và lane ấy là việc CUỐI CÙNG trước lượt verify. Con số 3 bác một giả
      định mang từ vòng trước (`scripts/ci/**` → 0): hai hồ sơ vừa ký không khai phạm vi
      hẹp nên dùng phạm vi mặc định. KHÔNG khai `paths` → luôn chạy lại.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
