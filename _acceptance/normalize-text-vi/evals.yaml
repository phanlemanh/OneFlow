    expected: "exit 0; chạy 2 lần byte-identical; normalize(normalize(x)) == normalize(x) trên TOÀN corpus (không chỉ vài mẫu). Chiều đỏ: chèn một quy tắc phụ thuộc trạng thái → assert đỏ nêu chuỗi nào không idempotent"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.sdk_pytest_normalize_edges
    paths: ["sdk/tongflow/text/**", "sdk/tests/test_normalize_vi.py"]
    expected: "exit 0; rỗng/chỉ khoảng trắng → success:false + error rõ (thư viện tự nó trả chuỗi rỗng không báo lỗi — đây là việc của vỏ ta, phải có ca chứng minh); văn bản thuần chữ ra y nguyên TRỪ dạng chữ (so byte với bản lower() của đầu vào, không so 'gần giống'); chuỗi ≥10.000 ký tự và emoji/URL/email không crash; VÀ văn xuôi không số không bị từ chối vì dấu câu — 'Ghi chú:Xem thêm' phải ok=True trong khi 'ngày 14:30' vẫn ok=False, đo CẢ HAI trong một test (amendment Cổng 2 vòng 4: luật dấu hai chấm chuyển từ hình dạng sang quan hệ vào↔ra); HAI ASSERT QUAN HỆ bắt buộc: unicodedata.is_normalized('NFC', out) đúng trên TOÀN corpus, và normalize(NFD(x)) == normalize(NFC(x)) byte-identical với mọi ca corpus có dấu, VÀ .ok + has_money cũng phải khớp giữa hai dạng — bản đầu chỉ so .text nên lỗ NFD của luật tiền vô hình (S4-r1). Chiều đỏ: gỡ bước chuẩn hoá dạng ở tiền xử lý → assert đỏ nêu đúng chuỗi nào lệch dạng"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

