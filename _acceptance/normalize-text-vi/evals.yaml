    paths: ["sdk/tongflow/engine/node_cache.py", "sdk/tests/test_node_cache.py", "config/tongflow.abi.json"]
    expected: "exit 0; guard allowlist hai chiều vẫn xanh sau khi thêm slot — danh sách ghim khớp TIER_A_SLOTS và mọi slot trong đó tồn tại trong ABI"
