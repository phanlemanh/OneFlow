  - id: E15
    criterion: AC-15
    executor: ui-check
    paths: ["src/components/workspace/nodes/transfer/normalize-text-vi.tsx", "src/i18n/messages/**"]
    steps:
      - "NEO CÂY TRƯỚC MỌI BƯỚC: cây được giao là repoRoot của bộ tham số (KHÔNG phải cwd phiên hay worktree nào của harness) — cd vào repoRoot rồi kiểm `git rev-parse HEAD` đúng bằng invokedSha của vòng; lệch → DỪNG và báo, không đoán. Lý do phải neo bằng phép đo: một vòng trước agent chụp coi worktree phiên của mình là cây thật, thấy repoRoot 'lạ' bèn tắt dev server ĐÚNG rồi quay về cây KHÔNG có feature, gặp 404 và dừng oan — cwd mặc định của phiên không phải bằng chứng về cây được giao, sha mới là"
      - "Kiểm cổng 3000 TRƯỚC bằng `lsof -nP -iTCP:3000 -sTCP:LISTEN` (KHÔNG dùng `lsof -ti:3000` — nó đếm cả kết nối ra-vào của tiến trình khác và báo bận trên một cổng đang trống): có tiến trình lạ NGHE ở đó thì DỪNG và báo — làn khác của pilot dùng chung cổng này, và ảnh chụp nhầm cây trông y hệt ảnh thật"
      - "Khởi động dev server với thư mục build RIÊNG: NEXT_DIST_DIR=build pnpm dev. BẮT BUỘC — bộ kiểm của cùng vòng này có bước build ghi vào .next, và next build với next dev dùng chung thư mục đó với hai layout không tương thích: server mất chunk giữa chừng rồi trả 500 ở mọi route. Đã giết 9 lượt chụp của làn kia trước khi tìm ra"
      - "KHÔI PHỤC NGAY SAU KHI SERVER LÊN, trước khi làm gì khác: `git checkout -- tsconfig.json`. Next ghi lại file đó ĐÚNG MỘT LẦN lúc dev server khởi động với thư mục build khác (thêm <distDir>/types vào include, đổi thụt lề 4→2), KHÔNG ghi lại ở mỗi lượt biên dịch — đo được. Để nguyên thì `pnpm lint:check` trong bộ kiểm của CHÍNH vòng này đỏ, và vòng REJECT vì một lý do không dính gì tới tính năng. Dọn ở cuối là không đủ: bộ kiểm chạy trước lúc đó"
      - "KIỂM XUẤT XỨ, bắt buộc trước mọi lượt chụp: curl -s -H 'Accept-Language: vi' {url}/proto/normalize-text-vi phải chứa chuỗi 'Đọc số thành chữ'. Header locale BẮT BUỘC — app không có locale trung tính: thiếu cookie NEXT_LOCALE và thiếu Accept-Language khớp thì src/i18n/request.ts rơi về zh, chuỗi tiếng Việt không bao giờ hiện và vòng 5 đã dừng oan đúng chỗ này. Không thấy chuỗi → DỪNG và báo là chụp nhầm cây hoặc trang hỏng, KHÔNG ghi là đỏ tiêu chí"
      - "Mở {url}/proto/normalize-text-vi (node THẬT trong canvas React Flow thật, chỉ dữ liệu là fixture). TRƯỚC TIÊN đặt cookie NEXT_LOCALE=vi cho origin rồi reload — trình duyệt chụp không hứa gửi Accept-Language: vi, và app rơi về zh khi thiếu cả hai (cùng lỗ với bước xuất xứ); kiểm <html lang='vi'>. TRƯỚC KHI LƯU: kiểm thuộc tính data-proto-state của trang phải đúng bằng 'idle'; thấy 'unknown:...' thì DỪNG, không lưu ảnh → chụp state-1-idle.png. LỆNH CHỤP GHIM CỨNG, không dùng công cụ khác và không bỏ cờ nào: `node scripts/ui-capture.mjs '{url}/proto/normalize-text-vi' '_acceptance/normalize-text-vi/evidence/design/captures/state-1-idle.png' --w 1280 --h 900 --wait 1800 --lang vi --require 'Đọc số thành chữ' --html '_acceptance/normalize-text-vi/evidence/design/captures/state-1-idle.html'`. KHỔ KHUNG là một phần của bằng chứng: bước này từng không khai nó, nên hai vòng liền agent chụp bằng mặc định 390x844 của công cụ (khổ điện thoại) và hội đồng E16 không thể thấy handle lẫn đường dây trên một canvas máy tính bị bóp vào 390px — UNCERTAIN hai lần vì dụng cụ chứ không vì sản phẩm (S4 vòng 3 + vòng 4). `--lang vi` ép cookie NEXT_LOCALE + Accept-Language; `--require` khiến công cụ TỪ CHỐI ghi và XOÁ ảnh cũ ở đúng đích khi trang không mang chuỗi tiếng Việt."
      - "Mở {url}/proto/normalize-text-vi?state=wired. TRƯỚC KHI LƯU: data-proto-state phải đúng bằng 'wired' → chụp state-2-wired.png. LỆNH CHỤP GHIM CỨNG, không dùng công cụ khác và không bỏ cờ nào: `node scripts/ui-capture.mjs '{url}/proto/normalize-text-vi?state=wired' '_acceptance/normalize-text-vi/evidence/design/captures/state-2-wired.png' --w 1280 --h 900 --wait 1800 --lang vi --require 'Đọc số thành chữ' --html '_acceptance/normalize-text-vi/evidence/design/captures/state-2-wired.html'`. KHỔ KHUNG là một phần của bằng chứng: bước này từng không khai nó, nên hai vòng liền agent chụp bằng mặc định 390x844 của công cụ (khổ điện thoại) và hội đồng E16 không thể thấy handle lẫn đường dây trên một canvas máy tính bị bóp vào 390px — UNCERTAIN hai lần vì dụng cụ chứ không vì sản phẩm (S4 vòng 3 + vòng 4). `--lang vi` ép cookie NEXT_LOCALE + Accept-Language; `--require` khiến công cụ TỪ CHỐI ghi và XOÁ ảnh cũ ở đúng đích khi trang không mang chuỗi tiếng Việt. Lý do bắt buộc kiểm: trang từng rơi về idle cho MỌI tên state lạ, nên gõ sai một chữ vẫn ra 200, vẫn qua sàn design, và ảnh idle vẫn được nộp dưới nhãn wired"
      - "Chạy sàn P0 design gate bằng lệnh config:executors.design.gate trên bản HTML vừa chụp và đính kết quả vào output"
      - "Assert: console không có lỗi; node hiện đúng hai handle in:text / out:text; nhãn nút đọc được bằng tiếng Việt, không phải khoá i18n thô"
      - "DỌN, bắt buộc — chạy DÙ CÁC BƯỚC TRÊN THÀNH CÔNG HAY THẤT BẠI, và trước khi kết thúc dù kết thúc kiểu gì: tắt dev server, `git checkout tsconfig.json`, `rm -rf build`. Next ghi đè tsconfig mỗi lần khởi động với thư mục build khác — nó đổi cả NỘI DUNG (include trỏ build/types thay vì .next/types), không chỉ định dạng. Không dọn thì `pnpm lint:check` của chính vòng này đỏ trên một cây vốn sạch, và cây để lại bẩn cho vòng sau"
    expected: "hai ảnh tồn tại và là ảnh của CÂY NÀY (đã kiểm xuất xứ); sàn P0 design gate xanh; console sạch. THU HẸP so với bản Cổng 1 (4 state): 'đang-chạy' và 'lỗi-còn-sót-token' do exec.loading và trạng thái task lái nên không đặt được từ ngoài mà không giả lập store hoặc sửa shell dùng chung — lời hứa về CHỮ của thông điệp lỗi chuyển sang phép đo tất định E6a. Trình ở Cổng 2."
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

