# 26 eval / 15 tiêu chí — AC-1, AC-6, AC-9, AC-10, AC-11, AC-12, AC-13, AC-14, AC-15 có nhiều eval.
# Bốn tiêu chí cross-layer NGUYÊN TỬ (mọi eval của chúng phải chạy CÙNG một round — cấm ghép
# bằng chứng backend round cũ với bằng chứng lớp trên round mới):
#   AC-10 = E10a + E10b + E10c · AC-11 = E11a + E11b · AC-12 = E12a + E12b · AC-14 = E17a + E17b.
# Sửa sau phản biện context sạch 19/08: E2/E3/E4 đổi sang ma trận toàn phần (F2) · thêm E10c
# đối chiếu ABI hai chiều (F3) · E14 tách thành E14a ngoại tuyến + E14b trực tuyến (F4) ·
# E8 thêm hai assert quan hệ về dạng Unicode (F5) · thêm E17a/E17b đo vỏ plugin thật (F1).
# Corpus vàng nằm TRONG kho này (sdk/tests/test_normalize_vi.py) chứ không ở repo plugin —
# quyết định §3 của design doc. Hệ quả: mọi eval đọc-thành-chữ đều khai `paths` và đều
# hưởng carry-forward round delta, không cần guard clone-and-pytest như họ overlay_*.
# Cặp hai chiều bắt buộc (MEASURE-BIRTH-CLAUSE) khai thẳng trong `expected`: chiều đỏ phải
# ghim THÔNG ĐIỆP, không chỉ exit code.
evals:
  - id: E1a
    criterion: AC-1
    executor: script
    cmd: config:executors.script.gen_abi_clean
    paths: ["config/tongflow.abi.json", "src/generated/abi/index.ts", "sdk/tongflow/_data/tongflow.abi.json", "scripts/gen-abi-types.ts"]
    expected: "exit 0; generated TS + bản copy _data khớp ABI đã commit (git diff --exit-code). Chiều đỏ: xoá slot khỏi index.ts đã commit → diff đỏ, nêu đúng đường dẫn file lệch"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E1b
    criterion: AC-1
    executor: script
    cmd: config:executors.script.abi_python_gen_clean
    paths: ["config/tongflow.abi.json", "sdk/tongflow/models/normalize_text_vi.py", "sdk/tongflow/node_slots.py", "sdk/tongflow/gen_models.py", "sdk/tongflow/gen_node_slots.py", "scripts/abi/check-python-gen-clean.sh"]
    expected: "exit 0; chạy lại gen_models.py + gen_node_slots.py rồi git diff --exit-code sdk/tongflow/models sdk/tongflow/node_slots.py — có NormalizeTextViInput/Output + NORMALIZE_TEXT_VI, và file untracked cũng bị bắt"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.sdk_pytest_normalize_money
    paths: ["sdk/tongflow/text/**", "sdk/tests/test_normalize_vi.py", "sdk/pyproject.toml"]
    expected: "exit 0; MA TRẬN TOÀN PHẦN khai trước trong file test — trục biến thể {linh, lẻ, mốt, lăm, mươi-vs-mười} × trục vị trí {chục sau 20..90, trăm, nghìn, triệu, tỷ}, mỗi ô ≥1 ca (41 → bốn mươi MỐT, 125.000 → một trăm hai mươi LĂM nghìn, 105 → một trăm LINH năm); assert len(CORPUS_MONEY) == literal; expected là literal viết tay trong file test, KHÔNG dán từ output thư viện. Chiều đỏ: xoá một ô ma trận → assert đỏ nêu ĐÚNG TÊN Ô thiếu, không chỉ exit code"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.sdk_pytest_normalize_datetime
    paths: ["sdk/tongflow/text/**", "sdk/tests/test_normalize_vi.py"]
    expected: "exit 0; ma trận toàn phần {ngày, tháng, năm, giờ, phút, khoảng} × {có số 0 đứng đầu, không có, hai chữ số, bốn chữ số} khai trước trong file test, mỗi ô ≥1 ca — 19/8/2026, 19-08-2026, 14:30, 25-26/12; trật tự đọc ngày-tháng-năm; assert len(CORPUS_TIME) == literal. Chiều đỏ như E2 (ô trống → đỏ kèm tên ô)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.sdk_pytest_normalize_identifiers
    paths: ["sdk/tongflow/text/**", "sdk/tests/test_normalize_vi.py"]
    expected: "exit 0; ma trận toàn phần {điện thoại, đơn vị đo, viết tắt hành chính} × {đứng đầu câu, giữa câu, cuối câu} khai trước, mỗi ô ≥1 ca; 0901234567 đọc TỪNG CHỮ SỐ (không thành số lượng); m², km/h, kg bung đúng; TP.HCM → 'thành phố hồ chí minh', Q.7 → 'quận bảy', P.Bến Nghé → 'phường bến nghé' theo từ điển ngành trong kho, và KHÔNG còn dấu chấm viết tắt nào sót trong đầu ra; assert len(CORPUS_ID) == literal. Chiều đỏ: bỏ một mục từ điển → assert đỏ nêu đúng viết tắt không bung"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.sdk_pytest_normalize_ambiguous
    paths: ["sdk/tongflow/text/**", "sdk/tests/test_normalize_vi.py"]
    expected: "exit 0; 5/3 → 'năm tháng ba', 1.500 → 'một nghìn năm trăm', 10-15 → 'mười ĐẾN mười lăm' (không còn dấu gạch), VÀ chốt khoảng áp cả hai đầu mang hậu tố đơn vị: 5%-10% và 5% - 10% → '... đến ...' không bao giờ thành 'âm' (nâng phạm vi Cổng 2, owner 2026-08-21 — trước đó 5%-10% đọc 'năm phần trămâm mười phần trăm' với ok=True); VÀ dải giá VIẾT CÁCH cũng giữ chữ 'đến': 1.000 đ-2.000 đ · 1.000 ₫ - 2.000 ₫ · 1.000 đồng - 2.000 đồng (Cổng 2 vòng 3, owner 2026-08-21 — cả ba từng ra 'một nghìn đồng hai nghìn đồng', mất hẳn chữ nối, ok=True, do bản vá vòng trước chạy _SPACED_DONG trước _RANGE và phá mỏ neo 'đ'); VÀ đo theo LỚP chứ không theo ca (amendment Cổng 2 vòng 4): ma trận {không đơn vị, ký hiệu, chữ viết tắt, từ đầy đủ} × {dính, có khoảng trắng} khai TRƯỚC trong file test, mỗi ô có ca hoặc nằm trong DELIBERATELY_UNCOVERED_RANGE_CELLS kèm lý do, và assert nêu ĐÚNG TÊN Ô còn trống — 5 triệu - 10 triệu · 5 tỷ - 10 tỷ · 5kg-10kg · 5 người - 10 người đều từng mất chữ 'đến' với ok=True vì luật cũ neo vào DANH SÁCH đơn vị; luật nay neo vào SỐ; đúng chốt hợp đồng và KHÔNG phụ thuộc ngữ cảnh câu (cùng chuỗi trong 3 câu khác nhau ra cùng kết quả). Chiều đỏ: đổi chốt trong code → assert đỏ nêu đúng ca mơ hồ nào lệch chốt (đã chứng minh hai lần: thu hẹp luật khoảng → đỏ nêu đúng ca 5%-10%; đảo lại thứ tự hai luật → đỏ nêu đúng ca 1.000 đ-2.000 đ)"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6a
    criterion: AC-6
    executor: test
    cmd: config:executors.test.sdk_pytest_normalize_residual_fail
    paths: ["sdk/tongflow/text/**", "sdk/tests/test_normalize_vi.py"]
    expected: "exit 0; chuỗi có token không đọc được → success:false và error LIỆT KÊ ĐÚNG các token còn sót (so danh sách, không so chuỗi con). Đây là nửa ÂM của cặp hai chiều — nửa dương là E6b trên cùng fixture"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6b
    criterion: AC-6
    executor: test
    cmd: config:executors.test.sdk_pytest_normalize_residual_pass
    paths: ["sdk/tongflow/text/**", "sdk/tests/test_normalize_vi.py"]
    expected: "exit 0; cùng fixture ở dạng lành → success:true, đầu ra KHÔNG chứa ký tự 0-9 / ₫ / % / dấu gạch giữa hai số; VÀ luật QUAN HỆ: mọi ca corpus có dấu hiệu tiền ở đầu vào (₫, đ, VNĐ, VND) phải có từ chỉ tiền ở đầu ra — assert quan hệ vào↔ra trên từng ca, không phải assert vắng-mặt trên đầu ra, VÀ mỏ neo dương độc lập: has_money phải True trên danh sách literal 6 cách viết tiền — kể cả dạng '500 đ' có khoảng trắng, dạng này phải ĐỌC ĐƯỢC thành '... đồng' chứ không bị từ chối, VÀ kể cả chữ HOA — 'Giá 500 Đ', 'GIÁ 1.999.000 Đ', 'Giá 125.000 ĐỒNG' đều phải ok=True và đọc ra chữ tiền (amendment Cổng 2 vòng 4: ba lớp cùng trượt nên 'Giá 500 Đ' ra 'giá năm trăm đ' với ok=True) (nâng phạm vi Cổng 2, owner 2026-08-21) (predicate chết luôn-False từng rỗng-hoá cả vòng quan hệ lẫn luật runtime mà không test nào đỏ — S4-r2). Chiều đỏ ghim: bỏ bước đổi ₫→đ ở tiền xử lý thì 1.999.000₫ ra 'một triệu chín trăm chín mươi chín nghìn' — không còn chữ số nên luật vắng-mặt vẫn xanh, chỉ luật quan hệ mới đỏ, và thông điệp phải nêu đúng ca đó"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
