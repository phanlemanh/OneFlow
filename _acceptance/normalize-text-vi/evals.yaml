    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10b
    criterion: AC-10
    executor: test
    layer: backend-effect
    cmd: config:executors.test.unit_tts_order_compliant
    paths: ["src/lib/workflow/exporter.ts", "src/lib/workflow/tts-order-guard.test.ts"]
    expected: "exit 0; workflow có normalize-text-vi trên đường phụ thuộc thượng nguồn của TTS (kể cả cách 2 node) → export ra bình thường, KHÔNG lỗi, KHÔNG cảnh báo; VÀ đối chứng âm: workflow nhạc (gen-music, music-repaint, music-cover, music-lego, music-complete, separate-sound) không có normalize thượng nguồn cũng export sạch — trường text của chúng là lời mô tả cho model. Nửa dương của cặp E10a — thiếu nó thì một guard luôn-ném cũng xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10c
    criterion: AC-10
    executor: test
    layer: backend-effect
    cmd: config:executors.test.unit_tts_family_matches_abi
    paths: ["src/lib/workflow/exporter.ts", "src/lib/workflow/tts-order-guard.test.ts", "config/tongflow.abi.json"]
    expected: "exit 0; đối chiếu HAI CHIỀU danh sách trắng họ TTS ghim trong guard với tập derive từ config/tongflow.abi.json theo tiêu chí khai ở design §5 — không slot nào trong ABI thoả tiêu chí mà vắng khỏi guard, và không tên nào trong guard vắng khỏi ABI. Chiều đỏ: thêm một slot TTS giả vào bản ABI fixture → đỏ, thông điệp nêu ĐÚNG TÊN slot chưa khai. Cùng khuôn hai chiều mà E11b dùng cho TIER_A_SLOTS — hạng mục 1.4 sắp thêm slot TTS ElevenLabs"
