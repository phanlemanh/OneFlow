    executor: test
    cmd: config:executors.test.unit_normalize_export
    paths: ["src/lib/workflow/exporter.ts", "src/lib/workflow/normalize-text-vi-export.test.ts", "src/lib/abi/node-feature-registry.ts"]
    expected: "exit 0; exporter phát ExecutableNode có pluginId top-level + prompt chỉ chứa text — không bindings/paramMappings viết tay"
