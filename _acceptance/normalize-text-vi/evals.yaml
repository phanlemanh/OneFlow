    criterion: AC-13
    executor: script
    cmd: config:executors.script.normalize_sdk_train_local
    paths: ["sdk/pyproject.toml", "sdk/tongflow/__init__.py", "scripts/abi/check-normalize-sdk-train-local.sh"]
    expected: "exit 0; NGOẠI TUYẾN, chạy mọi vòng: hai file version khớp nhau (0.2.19) — số DERIVE từ pyproject.toml chứ không ghi cứng trong script; vietnormalizer==0.2.3 pin chính xác trong dependencies; ROOT suy từ vị trí script (BASH_SOURCE) chứ không từ cwd. Chiều đỏ: lệch một trong hai version → đỏ nêu đúng hai số"
