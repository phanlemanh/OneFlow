  - id: E17a
    criterion: AC-14
    executor: script
    layer: backend-effect
    cmd: config:executors.script.normalize_plugin_shell
    paths: ["sdk/tongflow/text/", "sdk/tongflow/slots.py", "scripts/plugins/run-normalize-plugin-tests.sh"]
