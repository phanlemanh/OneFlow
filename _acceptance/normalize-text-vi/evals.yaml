    expected: "exit 0; manifest có entry origin THỨ TƯ oneflow-api-normalize-text-vi dưới phanlemanh; check-manifest-unmoved.sh đã cập nhật (36 chuỗi + 4 origin, id set có tên mới) và check-manifest-guard-teeth.sh vẫn đỏ trên cả 6 phép nhiễu KHÔNG cần sửa file đó; cả 3 README có plugin trong danh sách + một DÒNG MỚI dưới Transform → Text của ma trận năng lực (không phải lật ⬜→✅ hàng có sẵn — hôm nay mục đó chỉ có một hàng); i18n đủ 5 locale dưới normalizeTextVi.*"
