      <text x="32" y="664" fill="#66607a" font-size="9" font-family="'Geist Mono', monospace">AC-9: handles đúng từ ABI (in:text / out:text); sourceSpec { text: textBatch() } giữ fan-out một-lời-gọi-mỗi-chuỗi, giống hệt các node TTS.</text>
