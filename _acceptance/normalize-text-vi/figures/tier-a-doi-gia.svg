      <text x="32" y="688" fill="#66607a" font-size="9" font-family="'Geist Mono', monospace">Lượt 2 không đổi gì → full hit, 0 lời gọi plugin. Đổi chuỗi text vào → tầng B không chạy lại, normalize-text-vi chạy lại. Guard allowlist hai chiều vẫn xanh.</text>
