      justify-content: center;
      padding: 3rem 2rem;

      margin-bottom: 0.5rem;

      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--color-muted);
      max-width: 62ch;
      margin-bottom: 1.5rem;

    svg { width: 100%; min-width: 900px; display: block; }
