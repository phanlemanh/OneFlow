# 2-space indentation REQUIRED — the kit's hook parses this file line-by-line.
schema_version: 1
enforcement: strict          # strict | warn | off
recheck: strict              # fresh repo, no legacy reports — start strict (kit guidance).
baseline_minutes: []         # pre-kit acceptance estimates (minutes/feature) — fill after first manual accepts.

# Verify mechanism of this repo (CLAUDE.md checklist): biome lint + tsc + next build
# + vitest + sdk pytest + plugins-scan verify + generated-ABI drift check.
executors:
  test:
    build: "pnpm build"
    typecheck: "pnpm typecheck"
    # Sequential on purpose: next build rewrites .next/types while tsc reads them —
    # parallel suite runs race (lesson: artifact-platform radar-m1 S4-r1).
    build_typecheck: "pnpm build && pnpm typecheck"
    lint: "pnpm lint:check"
    unit: "pnpm test"
    # Run through uv rather than the ambient python3. On macOS the ambient
    # interpreter is Homebrew's, where PEP 668 refuses `pip install pytest`, so
    # `python3 -m pytest` is permanently unavailable — CI passed only because it
    # pip-installs into a runner-owned interpreter first. `--no-project` plus
    # PYTHONPATH keeps sdk/uv.lock and sdk/.venv untouched, so a verify round
    # never dirties the tree; the SDK's runtime deps are named explicitly
    # because PYTHONPATH imports tongflow from source rather than installing it.
    sdk_pytest: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q"
    # task-metering Gate 1 (2026-07-25): the test files land during implementation;
    # keys are declared now so eval refs stay portable (artifact-platform pattern).
    unit_metering_schema: "pnpm vitest run src/db/metering-schema.test.ts"
    unit_metering_runner: "pnpm vitest run src/lib/task/metering.test.ts"
    # measure-harness Gate 1 (2026-07-26): files land during implementation.
    unit_measure: "pnpm vitest run src/lib/measure"
    # sdk-distribution-rename Gate 1 (2026-07-26): test file lands during
    # implementation; key declared now so eval refs stay portable.
    sdk_pytest_packaging: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_packaging.py"
    # oneflow-plugin-prefix Gate 1 (2026-07-26): test file lands during implementation.
    unit_plugin_id: "pnpm vitest run src/lib/plugins/plugin-id.test.ts"
    # oneflow-plugin-prefix, added at the T3 amendment: the scanner is the second
    # place the prefix is enforced, and the one that decides registration.
    sdk_pytest_scan_prefix: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_scan_prefix.py"
    # per-plugin-origin Gate 1 (2026-07-27): file lands during implementation.
    unit_official_manifest: "pnpm vitest run src/lib/plugins/official-manifest.test.ts"
    # cache-l1-fingerprint Gate 1 (2026-07-29): both test files land during
    # implementation; keys declared now so eval refs stay portable.
    # One key per criterion, each a distinct pytest node-id on the same two
    # files: sixteen criteria sharing one exit code is the exact
    # pattern the stale-scope-by-paths comment below forbids — a criterion
    # never implemented would look identical to one that passed.
    sdk_pytest_fingerprint_hashseed_stable: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_stable_across_processes_with_different_hashseed"
    sdk_pytest_fingerprint_business_diff: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_business_input_field_diff_changes_key"
    sdk_pytest_fingerprint_per_run_keys_stripped: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_per_run_keys_stripped_do_not_change_key"
    sdk_pytest_fingerprint_asset_bytes_same: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_asset_same_bytes_diff_file_key_same_key"
    sdk_pytest_fingerprint_asset_ref_diff: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_asset_same_file_key_diff_bytes_changes_key"
    sdk_pytest_fingerprint_missing_rev: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_missing_plugin_rev_is_not_cacheable"
    sdk_pytest_fingerprint_dirty_plugin: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_dirty_plugin_is_not_cacheable"
    sdk_pytest_fingerprint_rev_diff: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_plugin_rev_diff_changes_key"
    sdk_pytest_fingerprint_slot_diff: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_slot_diff_changes_key"
    sdk_pytest_fingerprint_plugin_id_diff: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_plugin_id_diff_changes_key"
    sdk_pytest_fingerprint_model_diff: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_model_none_vs_value_changes_key"
    sdk_pytest_fingerprint_sdk_version: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_sdk_version_patch_same_minor_diff"
    sdk_pytest_fingerprint_vectors_exact: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint_vectors.py::test_vectors_match_character_for_character"
    sdk_pytest_fingerprint_vectors_guard: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint_vectors.py::test_vector_guard_catches_schema_version_bump"
    sdk_pytest_fingerprint_digest_form_parity: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_digest_form_matches_normalize_call"
    sdk_pytest_fingerprint_dict_order_stable: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_fingerprint.py::test_dict_key_insertion_order_does_not_change_key"
    # cache-l2-store Gate 1 (2026-07-30): every file below lands during
    # implementation. One key per criterion, addressed by pytest node-id —
    # criteria sharing one exit code make a never-implemented case look
    # identical to a passing one (lesson: cache-l1-fingerprint review round 1).
    sdk_pytest_l2_hit_after_miss: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_second_run_hits_cache_with_zero_plugin_calls"
    sdk_pytest_l2_blob_into_run_store: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_hit_reputs_blobs_into_current_run_store"
    sdk_pytest_l2_no_entry_on_failure: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_failed_call_never_writes_an_entry"
    sdk_pytest_l2_unusable_entry_is_miss: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_unusable_entry_is_treated_as_miss"
    sdk_pytest_l2_write_failure_survives: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_unwritable_cache_dir_does_not_break_the_run"
    sdk_pytest_l2_deleted_dir_same_result: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_deleting_cache_dir_keeps_results_identical"
    sdk_pytest_l2_slot_not_allowlisted: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_slot_outside_allowlist_is_never_cached"
    sdk_pytest_l2_tenant_missing: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_missing_tenant_is_not_cacheable"
    sdk_pytest_l2_tenant_isolation: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_two_tenants_sharing_data_dir_do_not_cross_serve"
    sdk_pytest_l2_dirty_plugin: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_dirty_plugin_is_not_cacheable_end_to_end"
    sdk_pytest_l2_batch_partial_hit: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_batch_partial_hit_calls_only_the_misses"
    sdk_pytest_l2_blob_dedupe: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_shared_asset_stores_one_blob"
    sdk_pytest_l2_abi_digest_in_key: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_abi_change_invalidates_the_key"
    sdk_pytest_l2_engine_rejects_empty_tenant: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_engine_rejects_empty_tenant"
    # AC-14 is (cross-layer): this is its TS half. The engine half is the
    # sdk_pytest_l2_engine_rejects_empty_tenant key above.
    # -t scopes each criterion to its own test: two criteria live in this one
    # vitest file, and sharing its exit code is the pattern forbidden above.
    unit_l2_tenant_sentinel: "pnpm vitest run src/lib/task/engine-delegate.test.ts -t 'tenant sentinel'"
    unit_l2_data_dir_stable: "pnpm vitest run src/lib/task/engine-delegate.test.ts -t 'data_dir is stable'"
    sdk_pytest_l2_input_change_partial_rerun: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_changing_one_node_input_reruns_only_it_and_downstream"
    sdk_pytest_l2_bridge_same_data_dir_hits: "cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_node_cache.py::test_bridge_reuses_cache_across_two_invocations"
    # conformance-l0 Gate 1 (2026-07-28): every file below lands during implementation.
    sdk_pytest_batch: cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_engine_batch.py
    sdk_pytest_conformance: cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/conformance
    sdk_pytest_plugin_rev: cd sdk && PYTHONPATH=. uv run --no-project --with pytest --with tomli --with pydantic --with typing_extensions python -m pytest -q tests/test_plugin_rev.py
    unit_conformance: pnpm vitest run src/lib/abi/conformance.test.ts
    unit_plugin_rev: pnpm vitest run src/lib/plugins/plugin-rev.test.ts
    unit_node_cached: pnpm vitest run src/lib/task/node-cached.test.ts
  script:
    verify_plugins: "pnpm verify:plugins"
    # ABI is the contract; generated TS must be committed in sync (CLAUDE.md "ABI first").
    gen_abi_clean: "pnpm gen:abi && git diff --exit-code src/generated/abi sdk/tongflow/_data/tongflow.abi.json"
    # measure-harness: end-to-end CLI runs over the fixtures committed with the
    # feature — proves the wiring, not just the pure core.
    smoke_measure_wer: "pnpm tsx scripts/measure/wer.ts src/lib/measure/__fixtures__/wer"
    # tsx rather than the bash wrapper declared at Gate 1: the selftests build
    # temp databases and sample trees, which is TypeScript work. The eval refs
    # are unchanged — only the command they resolve to.
    smoke_measure_mos: "pnpm tsx scripts/measure/selftest-mos.ts"
    smoke_measure_cogs: "pnpm tsx scripts/measure/selftest-cogs.ts"
    # dependency-refresh-2026-07 Gate 1 (2026-07-26).
    deps_manifest_intact: "bash scripts/deps/check-manifest.sh"
    deps_lockfile_clean: "pnpm install --frozen-lockfile"
    deps_no_t3_drift: "bash scripts/deps/check-no-t3-drift.sh origin/main"
    # ci-actions-bump Gate 1 (2026-07-26). The run-reading keys query real
    # Actions runs via `gh` rather than re-running the work locally — a bumped
    # action can only be proved by the runner that executes it.
    ci_actions_pinned: "bash scripts/ci/check-action-pins.sh"
    # Narrowed after Gate 1 (see contract "Amendment"): the gate job's colour is
    # dominated by acceptance bookkeeping, so it cannot serve as evidence about
    # a checkout bump. This asserts the plumbing instead.
    ci_gate_plumbing: "bash scripts/ci/check-gate-plumbing.sh"
    ci_jobs_green: "bash scripts/ci/check-run-jobs.sh ci Lint 'Type Check' Build 'SDK Tests (Python)'"
    ci_docker_dryrun_guard: "bash scripts/ci/check-docker-dryrun.sh"
    ci_docker_dispatch_green: "bash scripts/ci/check-dispatch-run.sh docker"
    ci_ghcr_untouched: "bash scripts/ci/check-ghcr-untouched.sh"
    ci_desktop_dispatch_green: "bash scripts/ci/check-dispatch-run.sh desktop"
    ci_no_behaviour_drift: "bash scripts/ci/check-workflow-drift.sh origin/main"
    # oneflow-plugin-prefix Gate 1 (2026-07-26).
    docs_plugin_prefix: "bash scripts/plugins/check-prefix-docs.sh"
    prefix_no_config_drift: "bash scripts/plugins/check-no-config-drift.sh origin/main"
    # per-plugin-origin Gate 1 (2026-07-27).
    origin_single_impl: "bash scripts/plugins/check-single-url-rule.sh"
    origin_installer_parity: "pnpm tsx scripts/plugins/check-installer-parity.ts"
    origin_manifest_unmoved: "bash scripts/plugins/check-manifest-unmoved.sh"
    # conformance-l0 Gate 1 (2026-07-28).
    conformance_discriminating: bash scripts/conformance/check-suite-discriminating.sh
    plugin_rev_joined_path: pnpm tsx scripts/plugins/check-rev-joined-path.ts
    # stale-scope-by-paths Gate 1 (2026-07-28): every file below lands during
    # implementation. These live under scripts/acceptance/ on purpose — the
    # t1_skip_globs exemption for the gate tooling lists EXACT paths, so a guard
    # in a new subdirectory is gated and the gate applies to itself.
    # One key per eval, same guard with a different --case: nine evals behind one
    # command collapse nine criteria into one exit code, and a case that was
    # never implemented then looks identical to a case that passed.
    stale_scope_in_scope: bash scripts/acceptance/check-stale-scoping.sh --case in-scope
    stale_scope_out_of_scope: bash scripts/acceptance/check-stale-scoping.sh --case out-of-scope
    stale_scope_partial: bash scripts/acceptance/check-stale-scoping.sh --case partial
    stale_scope_under_declared: bash scripts/acceptance/check-stale-scoping.sh --case under-declared
    stale_scope_malformed: bash scripts/acceptance/check-stale-scoping.sh --case malformed
    stale_scope_indent_drift: bash scripts/acceptance/check-stale-scoping.sh --case indent-drift
    stale_scope_merged_halves: bash scripts/acceptance/check-stale-scoping.sh --case merged-halves
    stale_scope_suppression: bash scripts/acceptance/check-stale-scoping.sh --case suppression
    stale_scope_two_bases: bash scripts/acceptance/check-stale-scoping.sh --case two-bases
    stale_scope_announce: bash scripts/acceptance/check-stale-scoping.sh --case announce
    stale_scope_mutation: bash scripts/acceptance/check-stale-scoping.sh --case mutation
    stale_scope_case_completeness: bash scripts/acceptance/check-stale-scoping.sh --case case-completeness
    stale_scope_guard_not_exempt: bash scripts/acceptance/check-stale-scoping.sh --case guard-not-exempt
    stale_scope_no_kill_switch: bash scripts/acceptance/check-stale-scoping.sh --case no-kill-switch
    stale_scoping_golden: bash scripts/acceptance/check-stale-golden.sh
    stale_scope_real_repo: bash scripts/acceptance/check-stale-real-repo.sh
  design:
    # PORTABLE $HOME+glob (not hardcoded home/version): survives plugin upgrades and
    # multi-machine use (lesson: artifact-platform 2026-07-03 path ping-pong).
    gate: "node $(ls $HOME/.claude/plugins/cache/*/acceptance-gate/*/scripts/design-gate.mjs | sort -V | tail -1)"
    # ui_check is a browser-injected asset (runner loads it INTO the page) — PATH only, no `node` prefix.
    ui_check: "$(ls $HOME/.claude/plugins/cache/*/acceptance-gate/*/scripts/design-scan.js | sort -V | tail -1)"

risk_tiers:
  # Docs/branding/config-only changes — acceptance gate skipped entirely.
  t1_skip_globs:
    - "docs/**"
    - "**/*.md"
    # Root-level .md files do NOT match "**/*.md" — list them explicitly
    # (lesson: artifact-platform PR #200/#302 treadmill).
    - "README.md"
    - "CLAUDE.md"
    - "AGENTS.md"
    - "CONTRIBUTING.md"
    - "STATUS.md"
    - "CHANGELOG.md"
    - "NOTICE.md"
    - ".gitignore"
    - ".claude/**"
    - "_acceptance/**"
    - "public/**"
    - "src/i18n/messages/**"
    # Vendored gate tooling = measuring stick, not product code; upgrading it must
    # not stale-invalidate signed feature evidence (exact paths, not globs).
    - "scripts/pre-merge-check.sh"
    - "scripts/recheck-evidence.js"
    - "lib/evidence-core.js"
    - "lib/gap-probe.js"
    # Lint configuration only — it constrains how source is written, never what
    # the product does at runtime, so a change here cannot invalidate evidence.
    - "biome.json"
  # Contract chokepoints & wire/persistence shape — always T3 (full gate).
  t3_paths:
    - "config/tongflow.abi.json"
    - "src/generated/abi/**"
    - "src/lib/abi/**"
    - "sdk/**"
    - "src/db/**"
    - "src/lib/plugin-executor/**"
    - "src/lib/workflow/**"
    - "src/app/api/**"
    - "scripts/publish-tongflow-pypi.sh"

signoff:
  required_for: [T2, T3]     # tiers that pre-merge-check requires signoff for
  approvers: ["Manh"]        # informational in v1 (not yet machine-enforced)
  require_human_commit: true # Gate-2 signature lands in its own human-fields-only commit.

# Suite verify chạy mỗi round S4 của plugin feature-loop (dotted keys trỏ vào executors.* ở trên).
# Per-feature evals nằm trong evals.yaml của từng feature, KHÔNG khai ở đây.
feature_loop:
  suite_keys:
    - executors.test.build_typecheck
    - executors.test.lint
    - executors.test.unit
    - executors.test.sdk_pytest
    - executors.script.verify_plugins
    - executors.script.gen_abi_clean

dev_server:
  start: "pnpm dev"
  url: "http://localhost:3000"

# capture.ui: omitted for now — no screenshot-to-file command in repo yet.
# To enable Gate-2 UI slideshow evidence: scaffold scripts/ui-capture.mjs from the kit
# reference + `pnpm add -D puppeteer-core`, then set:
#   capture:
#     ui: "node scripts/ui-capture.mjs"
