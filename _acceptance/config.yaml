  design:
    # PORTABLE $HOME+glob (not hardcoded home/version): survives plugin upgrades and
    # multi-machine use (lesson: artifact-platform 2026-07-03 path ping-pong).
    # --jsdom . is REQUIRED, not decoration: the gate resolves jsdom from its own
    # install (the plugin cache), which has no node_modules, so DOM mode returns
    # verdict BLOCKED / exit 3 without it. Measured 2026-08-21 on the
    # normalize-text-vi round-3 captures — same HTML: BLOCKED bare, PASS with the
    # flag. `.` is the repo root, where evals run and where jsdom is installed.
    # Note for whoever reads a raw run: jsdom prints "Could not parse CSS
    # stylesheet" on STDERR; capture stdout alone or the JSON will not parse.
    gate: "node $(ls $HOME/.claude/plugins/cache/*/acceptance-gate/*/scripts/design-gate.mjs | sort -V | tail -1) --jsdom ."
    # ui_check is a browser-injected asset (runner loads it INTO the page) — PATH only, no `node` prefix.
    ui_check: "$(ls $HOME/.claude/plugins/cache/*/acceptance-gate/*/scripts/design-scan.js | sort -V | tail -1)"
    a11y: node scripts/a11y-scan.mjs

risk_tiers:
  # Docs/branding/config-only changes — acceptance gate skipped entirely.
  t1_skip_globs:
    - "docs/**"
    - "**/*.md"
    # Root-level .md files do NOT match "**/*.md" — list them explicitly
    # (lesson: artifact-platform PR #200/#302 treadmill).
    - "README.md"
    - "CLAUDE.md"
    - "AGENTS.md"
    - "CONTRIBUTING.md"
    - "STATUS.md"
    - "CHANGELOG.md"
    - "NOTICE.md"
    # View máy sinh, KHÔNG phải vật để nghiệm thu: `product-map.mjs` vẽ lại nó từ
    # `_acceptance/*/` ở mỗi lần đóng cổng người, nên gate hoá nó là bắt hồ sơ
    # nghiệm thu chính cái bóng của mình. Cổng độc lập duy nhất biện minh cho
    # miễn trừ này là `product-map.mjs --check` (ADR 0007 của kit) — bỏ khai dòng
    # này mà vẫn commit bản đồ là cấu hình sai, kit tự có test bắt.
    - "PRODUCT-MAP.md"
    - ".gitignore"
    - ".claude/**"
    - "_acceptance/**"
    - "public/**"
    - "src/i18n/messages/**"
    # Vendored gate tooling = measuring stick, not product code; upgrading it must
    # not stale-invalidate signed feature evidence (exact paths, not globs).
    - "scripts/pre-merge-check.sh"
    # CẢ HAI bộ tên phải nằm đây cho tới khi commit đổi tên rời khỏi MỌI cửa sổ
    # diff. Kit 1.40.0 đổi `.js` -> `.cjs`; git ghi đổi tên vào diff PR như
    # «xoá đường cũ + thêm đường mới», nên nếu chỉ khai `.cjs` thì phía XOÁ nằm
    # ngoài miễn trừ và mọi slug có hồ sơ trong cùng diff hoá stale cùng lúc
    # (đo thật ở artifact-platform: 137 hồ sơ, thủ phạm là đúng một dòng).
    - "scripts/recheck-evidence.cjs"
    - "scripts/recheck-evidence.js"
    - "lib/evidence-core.cjs"
    - "lib/evidence-core.js"
    - "lib/gap-probe.cjs"
    - "lib/gap-probe.js"
    # pre-merge-check.sh gọi ac-line + md-section trong CÙNG một lệnh node để chấm
    # răng cross-layer. Thiếu một trong hai thì cổng vẫn chạy nhưng tụt về awk
    # rộng hơn và in NOTE — cùng lớp measuring-stick.
    - "lib/ac-line.cjs"
    - "lib/ac-line.js"
    - "lib/md-section.cjs"
    - "lib/md-section.js"
    # workspace-record: vendor LẦN ĐẦU ở lượt này. Trước đây oneflow thiếu hẳn
    # file này nên nhánh đọc workspace của cổng chưa từng chạy.
    - "lib/workspace-record.cjs"
    # Lint configuration only — it constrains how source is written, never what
    # the product does at runtime, so a change here cannot invalidate evidence.
    - "biome.json"
    # Hai bộ đo a11y của bề mặt /proto — cùng lớp measuring-stick với
    # pre-merge-check.sh ở trên: chúng ĐO sản phẩm chứ không phải sản phẩm, nên
    # sửa chúng không được phép làm stale bằng chứng đã ký của feature khác.
    # Khai ĐƯỜNG DẪN CHÍNH XÁC, không phải glob `scripts/**/check-a11y-proto.sh`:
    # một bộ đo mới ở thư mục khác phải tự qua cổng, y như lý lẽ đã ghi cho
    # scripts/acceptance/ ở phần executors.
    - "scripts/media-library/check-a11y-proto.sh"
    - "scripts/onboarding/check-a11y-proto.sh"
    # Prototype CHỈ tồn tại để được đo (render ở /proto/<slug> cho design-pass và
    # quét a11y); nó không nằm trên đường đi nào của người dùng. `data-proto-state`
    # là một chỗ bám cho bộ đo, giống hệt add-media-library-proto.tsx đã có.
    - "src/components/proto/byo-key-onboarding-proto.tsx"
    # tsconfig.json — owner chốt 02/09, ĐẢO quyết định 01/09 (hôm trước cố ý chừa).
    # Ghi lại cái giá cho người đọc sau, vì nó không hiển nhiên: đây là miễn trừ
    # theo TỆP chứ không theo thay đổi. Cổng không có cơ chế "chỉ miễn lần này",
    # nên từ đây MỌI sửa tsconfig đều lọt — kể cả tắt `strict`, đổi `target`, nới
    # `paths`, hay bỏ một đường trong `exclude`. Thứ thực sự cần miễn chỉ là một
    # dòng thêm dist dir vào `include`, và dòng đó tồn tại để chặn Next ghi đè
    # chính tệp này (xem scripts/onboarding/check-a11y-proto.sh).
    # Nói gọn: phạm vi dòng khai này BẢO VỆ hẹp hơn nhiều phạm vi nó CHO QUA.
    - "tsconfig.json"
  # Contract chokepoints & wire/persistence shape — always T3 (full gate).
  t3_paths:
    - "config/tongflow.abi.json"
    - "src/generated/abi/**"
    - "src/lib/abi/**"
    - "sdk/**"
    - "src/db/**"
    - "src/lib/plugin-executor/**"
    - "src/lib/workflow/**"
    - "src/app/api/**"
    - "scripts/publish-tongflow-pypi.sh"

signoff:
  required_for: [T2, T3]     # tiers that pre-merge-check requires signoff for
  approvers: ["Manh"]        # informational in v1 (not yet machine-enforced)
  # require_human_commit ĐÃ GỠ 2026-08-17: kit 2.1 cho khoá này (và agent_authors)
  # hết hiệu lực — ADR 0012. Provenance chữ ký nay lấy từ forge (ai approve / ai bấm
  # merge PR), và gate in một dòng NOTE «chữ ký mới trong diff» khi chữ ký xuất hiện
  # lần đầu trong diff. Đo trên chính kho này: lớp mất đi là «chữ ký không nằm trong
  # commit nào của báo cáo» — gate 1.38.0 chặn (exit 1), gate 2.1.0 cho qua (exit 0).
  # Giữ khoá lại chỉ khiến config KHAI một sự cưỡng chế không còn xảy ra.

# Suite verify chạy mỗi round S4 của plugin feature-loop (dotted keys trỏ vào executors.* ở trên).
# Per-feature evals nằm trong evals.yaml của từng feature, KHÔNG khai ở đây.
feature_loop:
  suite_keys:
    # Đứng đầu danh sách để người đọc bảng kết quả gặp nó trước; workflow chạy
    # các lệnh máy SONG SONG nên thứ tự này không phải thứ tự thi hành — bản
    # thân ô preflight phát biểu cách phân loại các ô còn lại.
    - executors.script.preflight_env
    # lat-cat-chung-minh (04/09): moi vong verify local cung phai thay dong bang —
    # cong local khong chay guard so cai, nen PR #96 len CI moi do.
    - executors.script.plan_freeze
    # GOP LAI 02/09 sau khi tach doi 31/08 (cong-tu-canh-minh). Ly do tach: mot
    # luot build bi cong cu giet (exit 144, do 322s) nuot luon tin hieu
    # typecheck di cung (24s). Ly do gop lai: tach doi dat `pnpm build` va
    # `pnpm typecheck` vao LAN SONG SONG, mo lai dung cuoc dua ma khoa gop von
    # ton tai de chan — `next build` ghi `.next/types` trong luc tsc doc no
    # (xem chu thich cua chinh khoa do trong `executors:`). Do hai vong lien
    # tiep cua chong-mat-khoa-byo-giao-dien: r1 TS6053 duoi `build/**` (chua
    # bang tsconfig exclude), r2 TS6053 duoi `.next/types/**` — cung LOP loi,
    # doi thu muc. Ly do tach nay da het hieu luc: TOOL-KILL-RULE (tran timeout
    # >= 600000ms + truong `killedByTool`) chinh la thu che ca bi cong cu giet,
    # va no chua ton tai hoi 31/08.
    - executors.test.build_typecheck
    - executors.test.lint
    - executors.test.unit
    - executors.test.sdk_pytest
    - executors.script.verify_plugins
    - executors.script.gen_abi_clean

dev_server:
  # Own dist dir, not the shared `.next`. The machine lane runs
  # `pnpm build && pnpm typecheck` (a standing suite key) in PARALLEL with the
  # ui-check lane, and a build landing while this server serves deletes the
  # chunks it is handing out. next.config.ts measured all three arms and named
  # this opt-out; only PAGES die, so the round loses its UI evidence while the
  # route-handler evals stay green — a broken round that reads like a clean one.
  # E24 boots its own server under build/aml-a11y for the same reason.
  # Cost, also measured there: Next rewrites tsconfig.json when the dist dir
  # differs from the recorded one, so a run must restore that file or the same
  # round's lint goes red on an otherwise clean tree.
  start: "NEXT_DIST_DIR=build pnpm dev"
  url: "http://localhost:3000"

# capture.ui: omitted for now — no screenshot-to-file command in repo yet.
# To enable Gate-2 UI slideshow evidence: scaffold scripts/ui-capture.mjs from the kit
# reference + `pnpm add -D puppeteer-core`, then set:
#   capture:
#     ui: "node scripts/ui-capture.mjs"
capture:
  ui: pnpm ui:capture
design_pass:
  proto_route: http://localhost:3000/proto/{slug}
  dev_cmd: pnpm dev
