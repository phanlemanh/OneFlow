schema_version: 1
feature_slug: hang-rao-doc-nham-loi-thanh-khong-co-gi

# T2, mười một tiêu chí. KHÔNG criterion nào (cross-layer): mọi When/Then chạy ở lớp
# script, sổ chạy JSONL và tệp khai ô đo.
#
# HAI ĐIỂM MÙ CỦA VÒNG NÀY, khai ngay đây vì chúng quyết cách đọc mọi vế xanh dưới:
#
# 1. Hàng rào khoá trùng (E6/E7) SINH RA ĐÃ XANH trên kho — đo 03/09: 0/34 tệp có khoá
#    lặp, vì ca duy nhất vừa được vá ở nhánh trước. Một lượt chạy xanh trên kho thật KHÔNG
#    chứng minh gì về nó; chỉ ca fixture mới chứng minh.
# 2. Diện của E8…E10 hôm nay là 1/530 ô đo còn khai `_acceptance` trần. Con số ấy chỉ
#    quay về sau khi E10 hoàn nguyên `paths` của E5/E6 hồ sơ repin — nên thứ tự làm có
#    ràng buộc: hoàn nguyên TRƯỚC, rồi mới đo được bế tắc đã hết.

# LUẬT FIXTURE ÁP CHO MỌI CA TEETH DƯỚI ĐÂY: dòng repin trong fixture phải được sinh
# bằng cách GỌI chế độ `write` của chính script, trong kho dùng-rồi-bỏ — rồi mới làm hỏng
# đúng nguồn dữ liệu cần thử. `printf` một dòng JSON theo hình dạng mà bộ đọc giả định là
# hai niềm tin độc lập: bộ đọc mới khớp đúng hình dạng viết tay ấy nên mọi ca xanh, còn
# dòng do `write` thật sinh ra lại rơi vào nhánh khác. Ngoại lệ DUY NHẤT là hình dạng bộ
# ghi không tạo ra được theo thiết kế — dòng ông bà không có `prev_sha` — và ca ấy phải
# nói rõ nó là ngoại lệ.

evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.hrdn_base_ref
    paths: ["scripts/ci/repin-eval-coverage.mjs", "scripts/ci/check-repin-eval-coverage.sh"]
    expected: >-
      exit 0, in `CASE base-khong-phan-giai: PASS`. Ca dựng một kho dùng-rồi-bỏ rồi chạy
      `newlines` với một tên nhánh không tồn tại; đòi thoát KHÁC 0, thông điệp chứa NGUYÊN
      VĂN tên base ấy, **và hai khẳng định nữa chứng minh chốt nằm TRƯỚC mọi lượt đọc
      tệp**: số dòng `FAIL` in ra bằng **0**, và KHÔNG có dòng tổng kết `dong run-log moi
      so ...` nào. Thiếu hai vế ấy thì một bản quét hết rồi mới dừng ở cuối vẫn xanh — nó
      in 1674 dòng mới và 25 lỗi giả y như hiện trạng, và ngưỡng 25 → 0 của hồ sơ cơ hội
      chưa hề được đo. Đo hiện trạng trước khi sửa: cùng lệnh in `dong run-log moi
      so refs/heads/khong-ton-tai: 1674` rồi 25 dòng FAIL — mỗi dòng đổ lỗi cho một hồ sơ
      không liên quan. Chiều đỏ của ô này là chính hiện trạng ấy, đã chạy được.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.hrdn_base_absent
    paths: ["scripts/ci/repin-eval-coverage.mjs", "scripts/ci/check-repin-eval-coverage.sh"]
    expected: >-
      exit 0, in `CASE base-thieu-file: PASS`. ĐỐI CHỨNG DƯƠNG của E1, và nó chịu lực
      thật: phép từ chối ở E1 rất dễ viết quá tay thành "mọi lượt `show` rỗng đều là lỗi",
      và một bản như thế vẫn làm E1 xanh. Ca này chạy `newlines` với base PHÂN GIẢI ĐƯỢC
      trên một hồ sơ mà `run-log.jsonl` chưa tồn tại ở base ấy, và đòi chế độ chạy bình
      thường, mọi dòng tính là mới. Đã kiểm răng: siết phép từ chối thành "rỗng cũng là
      lỗi" → ca này đỏ, E1 vẫn xanh.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.hrdn_diff_must
    paths: ["scripts/ci/repin-eval-coverage.mjs", "scripts/ci/check-repin-eval-coverage.sh"]
    expected: >-
      exit 0, in `CASE diff-that-bai: PASS`. Ca dựng một dòng repin mà `prev`/`sha` qua
      được `cat-file -t` nhưng phép so hai mốc thất bại, rồi đòi `check` DỪNG nêu cặp sha
      — thay vì trả danh sách file rỗng và tính lần ghim ấy là ĐÃ ĐO. Chiều đỏ: khôi phục
      `|| ""` → ca đỏ với "mong do, nhung thoat 0".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.hrdn_check_counts
    paths: ["scripts/ci/repin-eval-coverage.mjs", "scripts/ci/check-repin-eval-coverage.sh", "_acceptance"]
    self_referential: true
    expected: >-
      exit 0 trên kho thật, và dòng tổng kết in số dòng rơi vào hạng "ông bà" (đo 03/09:
      25 trên 52 dòng repin). Hạng ấy là miễn trừ CỐ Ý cho dòng lịch sử không có
      `prev_sha` — giữ nguyên, nhưng phải đếm được: một hạng miễn trừ không có số là chỗ
      mọi thứ hỏng trôi vào mà không con số nào đổi. Ô này CHẠY chính chế độ `check` nên
      khai `self_referential: true` theo AC-8.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.hrdn_shallow_probe
    paths: ["scripts/ci/repin-eval-coverage.mjs", "scripts/ci/check-repin-eval-coverage.sh"]
    expected: >-
      exit 0, in `CASE shallow-do-loi: PASS`. Ca làm lệnh dò clone nông THẤT BẠI (không
      phải trả "false"), rồi đòi `check` DỪNG thay vì giả định kho đầy đủ. Cùng lớp với
      E1 và E3: một lượt dò hỏng đang được đọc thành một câu trả lời. Chiều đỏ: bỏ phép
      từ chối → ca đỏ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.hrdn_dupkey
    paths: ["scripts/acceptance/check-eval-key-dupes.sh", "_acceptance"]
    expected: >-
      exit 0 cho HAI lượt: hàng rào mới chạy trên kho thật (xanh) và ca fixture có khối
      eval mang cùng một khoá hai lần (ĐỎ). Vế thứ nhất KHÔNG chứng minh gì — đo 03/09
      cho 0/34 tệp có khoá lặp, vì ca thật duy nhất vừa được vá ở nhánh trước; nó chỉ
      chứng minh hàng rào không đỏ oan trên dữ liệu lành. Vế thứ hai là toàn bộ bằng
      chứng. Ca thật đã xảy ra trên hồ sơ ĐÃ KÝ `noi-thuoc-tai-lieu-vao-ci`: `expected`
      hai lần trong khối E2, nên bằng chứng đã ký mô tả một phép đo đã bị rút.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.hrdn_dupkey_msg
    paths: ["scripts/acceptance/check-eval-key-dupes.sh"]
    expected: >-
      exit 0, in `CASE khoa-trung-neu-dich-danh: PASS`. Ca đòi thông điệp đỏ chứa ĐỦ BA
      thứ: tên hồ sơ · tên khoá bị lặp · số dòng. Và một khẳng định cấu trúc: hàng rào
      KHÔNG gọi `yaml.safe_load` (grep mã nguồn) — dùng chính bộ đọc nuốt khoá để bắt lỗi
      nuốt khoá là vô nghĩa, và đó là phép đo duy nhất ngăn ai đó "đơn giản hoá" nó về
      `safe_load` ở vòng sau.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-8
    executor: script
    cmd: config:executors.script.hrdn_selfref_declared
    paths: ["scripts/ci/repin-eval-coverage.mjs", "scripts/ci/check-repin-eval-coverage.sh"]
    expected: >-
      exit 0, in `CASE tu-quy-chieu-khai: PASS`. Ca dựng một hồ sơ fixture có ô đo khai
      `self_referential: true` và một lần ghim chạm `paths` của ô ấy, rồi đòi `check`
      XANH — ô được miễn khỏi tập phải-chạy-lại. Khai, KHÔNG đoán: nhận diện bằng cách dò
      tên script trong lệnh là đúng bệnh mà hồ sơ cơ hội này gọi tên (nhận diện theo hình
      dạng chuỗi thay vì theo chủ thể được khai), nên ca này cố ý dùng một lệnh KHÔNG
      chứa tên hàng rào — bản "đoán từ lệnh" sẽ trượt ở đây.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: script
    cmd: config:executors.script.hrdn_selfref_bucket
    paths: ["scripts/ci/repin-eval-coverage.mjs", "scripts/ci/check-repin-eval-coverage.sh", "_acceptance"]
    self_referential: true
    expected: >-
      exit 0 trên kho thật, và dòng tổng kết có thêm MỘT HẠNG CÓ TÊN cho ô tự-quy-chiếu
      kèm số đếm. **Số ấy phải được GHIM, không để trôi:** ô này đòi hạng ấy **≥ 5** và
      đòi đầu ra nêu đích danh tập rơi vào đó — E4/E9/E10 của hồ sơ này cộng E5/E6 của
      `repin-khong-chay-lai-eval` sau khi E10 hoàn nguyên `paths`. Chiều đỏ: gỡ MỘT dòng
      khai `self_referential` thì số phải giảm đúng một. Không ghim số thì một cài đặt in
      `tu-quy-chieu: 0` — vì đọc sai khoá, hoặc vì việc hoàn nguyên chưa xong — vẫn làm ô
      này xanh, đúng nghĩa "một phép miễn trừ im lặng không phân biệt được với một phép đo
      bị quên" mà AC-9 tự viết ra. Ô này cũng chạy `check` nên tự khai
      `self_referential: true`.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: script
    cmd: config:executors.script.hrdn_selfref_forget
    paths: ["scripts/ci/repin-eval-coverage.mjs", "scripts/ci/check-repin-eval-coverage.sh", "_acceptance"]
    self_referential: true
    expected: >-
      exit 0 cho HAI lượt. Lượt một: ca fixture `tu-quy-chieu-quen-khai` — cùng fixture
      như E8 nhưng BỎ dòng khai, đòi `check` ĐỎ. Hướng của phép quên là tiêu chí duy nhất
      đáng cân khi chọn cơ chế miễn trừ, nên nó phải có ô đo riêng chứ không nằm trong
      văn xuôi. Lượt hai: khẳng định `paths` của E5 và E6 trong
      `_acceptance/repin-khong-chay-lai-eval/evals.yaml` ĐÃ HOÀN NGUYÊN, chứa lại mục
      `_acceptance` — phép thu hẹp 03/09 mua yên tĩnh bằng cách bán độ phủ; không hoàn
      nguyên thì bế tắc chỉ đang bị giấu, và ô này sẽ xanh trên một kho đã bị làm mù.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-11
    executor: script
    cmd: config:executors.script.hrdn_resign_wave
    expected: >-
      exit 0 — không hồ sơ đã ký NÀO KHÁC còn mang bằng chứng có trước code của nhánh
      này. Vòng này chạm `scripts/ci/**` VÀ thêm một file mới dưới `scripts/acceptance/**`;
      đo 03/09 trên nhánh trước cho thấy chạm `scripts/acceptance/` làm 4 hồ sơ hoá ôi.
      Nên vòng này kèm một sự kiện re-pin, và lane ấy là việc CUỐI CÙNG trước lượt verify.
      KHÔNG khai `paths` → ô này luôn chạy lại, đúng mặc định an toàn.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
