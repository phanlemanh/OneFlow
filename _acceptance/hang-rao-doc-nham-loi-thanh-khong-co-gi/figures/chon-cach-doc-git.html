<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chọn cách đọc git khi phép đọc thất bại</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Lora:ital,wght@0,400;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper:       #f7f7f8;
    --paper-2:     #ececed;
    --node-fill:   #ffffff;
    --dim-fill:    #ececed;
    --dim-stroke:  rgba(26,0,51,0.30);
    --ink:         #1a0033;
    --muted:       #4f4a63;
    --soft:        #66607a;
    --rule:        rgba(26,0,51,0.12);
    --rule-solid:  rgba(26,0,51,0.28);
    --accent:      #e100e1;
    --accent-text: #a600a6;
    --accent-tint: rgba(225,0,225,0.08);
    --font-sans:  'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', 'Lora', serif;
    --font-mono:  'Geist Mono', ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:       #1a0033;
      --paper-2:     #241041;
      --node-fill:   #241041;
      --dim-fill:    #241041;
      --dim-stroke:  rgba(247,247,248,0.28);
      --ink:         #f7f7f8;
      --muted:       #c0bacf;
      --soft:        #a49cb8;
      --rule:        rgba(247,247,248,0.12);
      --rule-solid:  rgba(247,247,248,0.28);
      --accent:      #ff5cff;
      --accent-text: #ff9cff;
      --accent-tint: rgba(255,92,255,0.12);
    }
  }

  body {
    font-family: var(--font-sans);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }

  .frame { max-width: 1200px; width: 100%; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--ink);
    margin-bottom: 1.5rem;
  }

  svg { width: 100%; min-width: 900px; display: block; }

  /* ---- SVG roles ---- */
  .bg        { fill: var(--paper); }
  .mask      { fill: var(--paper); }
  .node      { fill: var(--node-fill); stroke: var(--ink); stroke-width: 1; }
  .node-dim  { fill: var(--dim-fill); stroke: var(--dim-stroke); stroke-width: 1; stroke-dasharray: 4 3; }
  .node-foc  { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.4; }
  .tag       { fill: none; stroke: var(--rule-solid); stroke-width: 0.8; }
  .tag-foc   { fill: none; stroke: var(--accent); stroke-width: 0.8; }
  .hair      { stroke: var(--rule); stroke-width: 1; }
  .rule-s    { stroke: var(--rule-solid); stroke-width: 1; }
  .flow      { fill: none; stroke: var(--muted); stroke-width: 1; }
  .flow-foc  { fill: none; stroke: var(--accent); stroke-width: 1.4; }
  .leader    { fill: none; stroke: var(--rule-solid); stroke-width: 1; stroke-dasharray: 4 3; }
  .dot       { fill: var(--ink); }

  .t-name    { fill: var(--ink);         font: 600 12px var(--font-sans); }
  .t-body    { fill: var(--muted);       font: 400 10px var(--font-sans); }
  .t-eye     { fill: var(--soft);        font: 500 9px var(--font-mono); letter-spacing: .14em; }
  .t-eye-foc { fill: var(--accent-text); font: 500 9px var(--font-mono); letter-spacing: .14em; }
  .t-sub     { fill: var(--muted);       font: 400 9px var(--font-mono); letter-spacing: .04em; }
  .t-arrow   { fill: var(--soft);        font: 400 9px var(--font-mono); letter-spacing: .06em; }
  .t-arrow-f { fill: var(--accent-text); font: 400 9px var(--font-mono); letter-spacing: .06em; }
  .t-quote   { fill: var(--ink);         font: italic 400 14px var(--font-serif); }

  #arrow polygon        { fill: var(--muted); }
  #arrow-accent polygon { fill: var(--accent); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Sơ đồ quyết định · hàng rào đọc nhầm lỗi thành “không có gì”</p>
  <h1>Chọn cách đọc git khi phép đọc thất bại</h1>

  <svg viewBox="0 0 1040 664" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="Sơ đồ quyết định ba nhánh: từ chín lượt đọc git, ba lối đã cân, kết luận bốn sửa năm giữ">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6"/>
      </marker>
    </defs>

    <rect class="bg" width="100%" height="100%"/>

    <!-- ============ CONNECTORS (drawn before boxes) ============ -->
    <!-- start -> option A (left) -->
    <path class="flow" d="M 420 120 L 420 144 A 8 8 0 0 1 412 152 L 192 152 A 8 8 0 0 0 184 160 L 184 200"
          marker-end="url(#arrow)"/>
    <!-- start -> option B (middle) -->
    <path class="flow" d="M 520 120 L 520 200" marker-end="url(#arrow)"/>
    <!-- start -> option C (right) -->
    <path class="flow" d="M 620 120 L 620 144 A 8 8 0 0 0 628 152 L 848 152 A 8 8 0 0 1 856 160 L 856 200"
          marker-end="url(#arrow)"/>

    <!-- option B -> outcome -->
    <path class="flow" d="M 520 408 L 520 444 A 8 8 0 0 1 512 452 L 448 452 A 8 8 0 0 0 440 460 L 440 496"
          marker-end="url(#arrow)"/>
    <!-- option C -> outcome (focal path) -->
    <path class="flow-foc" d="M 856 408 L 856 444 A 8 8 0 0 1 848 452 L 608 452 A 8 8 0 0 0 600 460 L 600 496"
          marker-end="url(#arrow-accent)"/>

    <!-- connector labels: mask sits 8px clear of the stroke -->
    <rect class="mask" x="450" y="428" width="60" height="16" rx="2"/>
    <text class="t-arrow" x="480" y="440" text-anchor="middle">PHẦN DƯ</text>
    <rect class="mask" x="692" y="428" width="72" height="16" rx="2"/>
    <text class="t-arrow-f" x="728" y="440" text-anchor="middle">LỐI CHÍNH</text>

    <!-- ============ START ============ -->
    <rect class="mask" x="320" y="48" width="400" height="72" rx="20"/>
    <rect class="node" x="320" y="48" width="400" height="72" rx="20"/>
    <text class="t-name" x="520" y="84" text-anchor="middle">Chín lượt đọc git trong hàng rào ghim</text>
    <text class="t-sub"  x="520" y="102" text-anchor="middle">repin-eval-coverage.mjs · gitOk ×9</text>

    <!-- ============ OPTION A — rejected ============ -->
    <rect class="mask"     x="32" y="200" width="304" height="208" rx="6"/>
    <rect class="node-dim" x="32" y="200" width="304" height="208" rx="6"/>
    <rect class="tag" x="44" y="212" width="64" height="16" rx="2"/>
    <text class="t-eye" x="76" y="224" text-anchor="middle">ĐÃ LOẠI</text>
    <text class="t-name" x="44" y="252">Bọc lại cả chín lượt đọc thành</text>
    <text class="t-name" x="44" y="268">«đọc được / không đọc được»</text>
    <line class="hair" x1="44" y1="284" x2="324" y2="284"/>
    <text class="t-eye"  x="44" y="304">ĐỔI LẤY</text>
    <text class="t-body" x="44" y="320">Mọi lượt đọc phân biệt được lỗi thật với</text>
    <text class="t-body" x="44" y="334">kết quả rỗng hợp lệ.</text>
    <text class="t-eye"  x="44" y="356">MẤT</text>
    <text class="t-body" x="44" y="372">Chạm cả bốn chỗ đang đúng — rủi ro</text>
    <text class="t-body" x="44" y="386">không đổi lấy gì.</text>

    <!-- ============ OPTION B — residual ============ -->
    <rect class="mask" x="368" y="200" width="304" height="208" rx="6"/>
    <rect class="node" x="368" y="200" width="304" height="208" rx="6"/>
    <rect class="tag" x="380" y="212" width="64" height="16" rx="2"/>
    <text class="t-eye" x="412" y="224" text-anchor="middle">PHẦN DƯ</text>
    <text class="t-sub" x="660" y="224" text-anchor="end">AC-3</text>
    <text class="t-name" x="380" y="252">Bắt buộc đọc được, chỉ ở ba chỗ</text>
    <text class="t-name" x="380" y="268">đang nuốt lỗi thành «không có gì»</text>
    <line class="hair" x1="380" y1="284" x2="660" y2="284"/>
    <text class="t-eye"  x="380" y="304">ĐỔI LẤY</text>
    <text class="t-body" x="380" y="320">Ba chỗ nguy hiểm nhất thôi biến lỗi git</text>
    <text class="t-body" x="380" y="334">thành «không file nào đổi».</text>
    <text class="t-eye"  x="380" y="356">MẤT</text>
    <text class="t-body" x="380" y="372">Vẫn là ba chốt rải rác; không chạm gốc —</text>
    <text class="t-body" x="380" y="386">mốc so sánh không phân giải được.</text>

    <!-- ============ OPTION C — chosen (focal) ============ -->
    <rect class="mask"     x="704" y="200" width="304" height="208" rx="6"/>
    <rect class="node-foc" x="704" y="200" width="304" height="208" rx="6"/>
    <rect class="tag-foc" x="716" y="212" width="104" height="16" rx="2"/>
    <text class="t-eye-foc" x="768" y="224" text-anchor="middle">CHỌN LÀM CHÍNH</text>
    <text class="t-sub" x="996" y="224" text-anchor="end">AC-1 · AC-5</text>
    <text class="t-name" x="716" y="252">Kiểm điều kiện tiên quyết ngay</text>
    <text class="t-name" x="716" y="268">đầu chế độ</text>
    <line class="hair" x1="716" y1="284" x2="996" y2="284"/>
    <text class="t-eye"  x="716" y="304">ĐỔI LẤY</text>
    <text class="t-body" x="716" y="320">Chặn đúng gốc, ngay trước khi đọc tệp nào.</text>
    <text class="t-body" x="716" y="334">Kho đã có sẵn đúng hình dạng ấy.</text>
    <text class="t-eye"  x="716" y="356">MẤT</text>
    <text class="t-body" x="716" y="372">Một mình chưa đủ: lượt so hai mốc vẫn cần</text>
    <text class="t-body" x="716" y="386">phần dư ở lối bên cạnh.</text>

    <!-- ============ OUTCOME ============ -->
    <rect class="mask" x="280" y="496" width="480" height="88" rx="20"/>
    <rect class="node" x="280" y="496" width="480" height="88" rx="20"/>
    <text class="t-name" x="520" y="528" text-anchor="middle">Bốn lượt chuyển sang từ chối, năm lượt giữ nguyên</text>
    <text class="t-sub"  x="520" y="546" text-anchor="middle">4 SỬA · 5 GIỮ — MỖI ĐIỂM GIỮ MỘT LÝ DO ĐÃ VIẾT</text>
    <text class="t-body" x="520" y="566" text-anchor="middle">AC-4 — hạng «ông bà» giữ nguyên, nhưng phải in số: 25/52.</text>

    <!-- ============ EDITORIAL CALLOUT ============ -->
    <path class="leader" d="M 944 504 Q 908 452 920 412"/>
    <circle class="dot" cx="920" cy="408" r="2"/>
    <text class="t-quote" x="1008" y="520" text-anchor="end">Một chốt ở đầu chế độ rẻ hơn</text>
    <text class="t-quote" x="1008" y="540" text-anchor="end">và đúng chỗ hơn chín lượt</text>
    <text class="t-quote" x="1008" y="560" text-anchor="end">kiểm rải rác.</text>

    <!-- ============ LEGEND ============ -->
    <line class="rule-s" x1="32" y1="604" x2="1008" y2="604"/>
    <text class="t-eye" x="32" y="622">CHÚ GIẢI</text>
    <rect class="node-foc" x="136" y="612" width="12" height="12" rx="2"/>
    <text class="t-sub" x="156" y="622">Lối đã chọn làm chính</text>
    <rect class="node" x="340" y="612" width="12" height="12" rx="2"/>
    <text class="t-sub" x="360" y="622">Phần dư — vẫn làm</text>
    <rect class="node-dim" x="560" y="612" width="12" height="12" rx="2"/>
    <text class="t-sub" x="580" y="622">Đã loại</text>
    <text class="t-sub" x="1008" y="622" text-anchor="end">AC-1 · AC-3 · AC-4 · AC-5</text>
  </svg>
</div>
</body>
</html>
