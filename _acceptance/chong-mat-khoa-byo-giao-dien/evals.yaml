  - id: E9
    criterion: AC-14
    executor: script
    cmd: config:executors.script.kkt_gd_a11y_proto
    paths:
      - "src/components/proto/chong-mat-khoa-byo-giao-dien-proto.tsx"
      - "src/app/proto/[slug]/page.tsx"
      - "scripts/settings/check-a11y-proto.sh"
    expected: >-
      exit 0. axe-core trong Chrome THẬT (`scripts/a11y-scan.mjs --fail-on critical,serious`)
      trên 6 trang = 3 trạng thái (`store-unreadable`, `store-unreadable-confirm`,
      `panel-unreadable`) × 2 giao diện (sáng/tối). 0 vi phạm `critical`/`serious`.
      Wrapper tự dựng server riêng cổng 3197 với `NEXT_DIST_DIR=build/kkt-a11y` và tự dọn —
      KHÔNG mượn server của người khác, và không dùng `.next` chung vì `pnpm build` là một
      suite key chạy SONG SONG, một lượt build hạ cánh giữa lúc quét sẽ xoá chunk server
      đang phát và CHỈ trang chết.
      NỬA ĐÀN ÁP — đây là nửa quan trọng nhất của ô này: wrapper ĐỌC LẠI `data-proto-state`
      khỏi từng trang và so với state đã yêu cầu, VÀ đọc lại trục sáng/tối bằng sự hiện
      diện của `class="dark"`; đếm phải là 3 state PHÂN BIỆT × 2 theme phân biệt, không
      phải 6 lượt truy cập. Không có nửa này, một tên state gõ sai vẫn cho 6 lượt chụp
      CÙNG MỘT màn hình mà mọi con số vẫn đủ.
      Bản mẫu render CHÍNH `store-unreadable-notice.tsx` (dấu
      `data-testid="store-unreadable-notice"`), cùng component mà E2/E6 khẳng định ba bề
      mặt thật dùng — đó là dây nối khiến sàn a11y đo ở đây nói được điều gì đó về màn
      Cài đặt, chứ không chỉ về bản mẫu.
      CHIỀU ĐỎ: đổi một tên state trong mảng `STATES` thành chuỗi không tồn tại thì wrapper
      PHẢI đỏ với thông điệp `rendered state 'unknown:<tên>', asked for '<tên>'` — và
      `a11y-scan.mjs` vẫn quét được 6 trang, tức exit khác 0 phải đến TỪ vòng đọc-lại chứ
      không từ lượt quét.
    evidence_required: [run_id, exit_code, verifier, verified_at, output, artifact]

