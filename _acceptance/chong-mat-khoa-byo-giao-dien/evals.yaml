      NỬA ĐÀN ÁP: ca huỷ hộp thoại phải cho tổng `PUT` bằng 0.
      CHIỀU ĐỎ: gỡ chốt một-chuyến (`useRef`) thì ca (d) PHẢI đỏ với thông điệp nêu số
      lượt PUT đếm được (2), không chỉ "expected 2 to be 1" trơ trọi. CHIỀU ĐỎ THỨ HAI:
      gửi thân thiếu `env` thì (b) PHẢI đỏ và thông điệp in NGUYÊN thân yêu cầu.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- D. Hai panel trên node từ chối (AC-12, đôi ô) ----------
  - id: E6
    criterion: AC-12
    executor: test
    cmd: config:executors.test.kkt_gd_panels_ui
    paths:
      - "src/components/workspace/nodes/add/media-library-config-panel.tsx"
      - "src/components/workspace/nodes/base/abi-node-shell.tsx"
      - "src/components/settings/store-unreadable-notice.tsx"
      - "src/components/workspace/nodes/store-unreadable-refusal.test.tsx"
    expected: >-
      exit 0. MA TRẬN TOÀN PHẦN 2 bề mặt × 5 hình dạng lỗi = **10 ca**, số ca ghim thành
      hằng trong tệp test và chính con số đó là một khẳng định. Năm hình dạng ĐÚNG như
      E2: 503 · 500 · 502-html · shape · network. Không được rút gọn về "kho hỏng (503)":
      Given của AC-12 sau amendment 01/09 là MỌI lượt đọc không cho ra map dùng được, và
      một bản vá `if (status === 503)` nội tuyến sẽ xanh ở ca 503 rồi gửi PUT ở bốn ca còn
      lại — đúng khuyết tật mà chính hồ sơ này gọi là "nửa dễ xanh giả nhất".
      Mỗi ca khẳng định: (a) hiện `role="alert"` nêu kho hỏng; (b) có lối sang màn Cài đặt
      đọc được; (c) KHÔNG có nút thoát — `queryAllByRole("button")` lọc theo nhãn
      thoát/ghi-đè, độ dài PHẢI bằng 0; (d) 0 phần tử `role="alertdialog"`; (e) đúng MỘT
      `[data-testid="store-unreadable-notice"]` — bề mặt thật phải render CHÍNH component
      chia sẻ, không phải bản chép tay, vì sàn a11y của AC-14 chỉ đo bản mẫu.
      Thông điệp lỗi của mọi khẳng định phải nêu CẢ tên bề mặt LẪN tên ca.
      NỬA ĐÀN ÁP: cùng hai bề mặt với kho LÀNH phải hiện form nhập như hôm nay và 0 tấm
      alert — nếu không, hai panel luôn-từ-chối cũng xanh.
      CHIỀU ĐỎ: thay bộ đọc chung ở `abi-node-shell` bằng `if (status === 503)` nội tuyến
      thì ĐÚNG 4 ca của bề mặt đó PHẢI đỏ (500 · 502-html · shape · network) và mỗi thông
      điệp nêu tên bề mặt + tên ca — một ca đỏ duy nhất nghĩa là ma trận chưa toàn phần.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

