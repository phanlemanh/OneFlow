      NỬA ĐÀN ÁP: ca kho LÀNH phải cho ra đúng 1 `PUT` khi bấm Lưu — nếu không, phép đo
      này cũng xanh trên một component không bao giờ ghi được gì.
      CHIỀU ĐỎ: gỡ thuộc tính `disabled` khỏi nút Lưu ở trạng thái kho-hỏng thì ca (b)
      PHẢI đỏ và thông điệp nêu số lượt PUT đếm được kèm thân yêu cầu.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- C. Lượt ghi huỷ-diệt (AC-11, đôi ô) ----------
  - id: E4
