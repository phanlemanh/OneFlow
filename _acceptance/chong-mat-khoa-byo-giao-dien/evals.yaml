      - "src/components/workspace/settings-dialog.replace.test.tsx"
    expected: >-
      exit 0. Từ trạng thái kho-hỏng: bấm nút thoát → (a) xuất hiện phần tử
      `role="alertdialog"`; (b) nội dung của nó chứa CẢ HAI ý, kiểm bằng hai khẳng định
      RIÊNG trên chuỗi đọc được: "mọi khoá đang lưu sẽ mất" và "không khôi phục được" —
      không gộp thành một `toContain` dài, để biết ý nào rụng; (c) có nút huỷ và nút xác
      nhận, nút xác nhận mang class của `buttonVariants({variant:"destructive"})` (kiểm
      bằng `toHaveClass` trên một token của biến thể đó, vd `bg-destructive`) chứ không
