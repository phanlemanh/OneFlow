schema_version: 1
feature_slug: chong-mat-khoa-byo-giao-dien

# T2, nửa GIAO DIỆN của chống-mất-khoá BYO. Sáu tiêu chí AC-9..AC-14, mười ô đo.
#
# MỘT Ô ĐO = MỘT TỆP TEST TRỌN VẸN, KHÔNG Ô NÀO DÙNG `-t`.
# `pnpm vitest run <file> -t '<tên>'` THOÁT 0 khi bộ lọc không khớp gì
# (`scripts/ci/check-eval-filters.mjs` sinh ra vì đúng lớp lỗi đó, đo trên hồ sơ
# cha 31/08: hai tiêu chí không có test nào mà cả hai ô báo PASS). Chia theo tệp
# làm lớp lỗi đó KHÔNG DỰNG ĐƯỢC: `vitest run <file>` trên tệp không có ca nào
# thì báo "No test suite found" và thoát khác 0. Đổi lại là bảy tệp mới thay vì
# ba — giá phải trả, và repo đã có tiền lệ đúng hình dạng này
# (`route.unreadable.test.ts` nằm cạnh `route.test.ts`).
#
# BA TIÊU CHÍ MANG TAG (cross-layer) — AC-10, AC-11, AC-12 — nên mỗi tiêu chí có
# ĐÔI ô: một ô lớp UI (người dùng thấy gì) + một ô `layer: backend-effect` (dây
# nối: lượt gọi nào THẬT SỰ rời trình duyệt). Chỉ đo lớp UI là nửa dễ xanh giả
# nhất: `abi-node-shell` hôm nay vẫn dựng đúng giao diện rồi vẫn gửi `PUT`.
#
# MỐI NỐI GIẢ LẬP: các ô UI/wire thay `global.fetch`. Đó KHÔNG phải hạ thước —
# trong jsdom không có máy chủ, nên `fetch` LÀ biên của hệ thống đang đo; điều
# các ô này khẳng định là "trình duyệt gửi/không gửi cái gì", đúng vế mà chữ AC
# viết ("rời khỏi trình duyệt"). Nửa máy chủ đã có bằng chứng riêng ở hồ sơ cha
# (`route.unreadable.test.ts`, AC-5..AC-8, đã ký 31/08).
#
# MỌI ô "từ chối" đo HAI CHIỀU trên cùng fixture (MEASURE-BIRTH-CLAUSE): vật lành
# → xanh, phá vật thật → đỏ với THÔNG ĐIỆP GHIM. Chiều đỏ ghi trong `expected`.
#
# `paths` khai trên mọi ô để round sau carry-forward phần diff không chạm.
# Ô đo a11y GIỮ shell dưới `scripts/settings/` — nó cần Chrome thật và phải tự
# dựng/dọn server; và đối chiếu `paths` của các hồ sơ đã ký cho thấy một tệp mới
# dưới `scripts/settings/**` kéo THÊM 0 hồ sơ vào wave re-pin.

evals:
  # ---------- A. Đường lib — "kho hỏng" ≠ "chưa cấu hình" ----------
  - id: E1
    criterion: AC-9
    executor: test
    cmd: config:executors.test.kkt_gd_resolve_config
    paths:
      - "src/lib/media-library/config.server.ts"
      - "src/lib/media-library/config.server.unreadable.test.ts"
    expected: >-
      exit 0. Trên MỘT thư mục tạm thật trỏ bằng TONGFLOW_DATA_DIR (không mock seam,
      cùng lối `vitest.config.ts` đã alias `@ext -> src/ext-default`). FIXTURE KHO
      LÀNH PHẢI SINH BẰNG `saveEnvStore()` — bộ GHI thật của kho — chứ KHÔNG viết tay
      JSON theo khuôn mà bên đọc mong đợi: một fixture tự dựng đúng khuôn bên đọc thì
      phép đo chỉ chứng minh test và reader đồng ý với nhau, không chứng minh reader
      đọc được thứ app THẬT ghi ra. Chỉ ca hỏng mới ghi rác thô. Các ca: (a) kho lành,
      đủ hai giá trị → `ok: true`; (b) kho VẮNG, `process.env` cũng vắng →
      `kind: "missing"` và `missing` nêu đúng tên hai biến; (c) kho HỎNG (JSON rác),
      `process.env` vắng → `kind: "store-unreadable"` kèm `reason` phân biệt được
      (`parse`); (d) kho HỎNG nhưng `process.env` cấp ĐỦ cả hai → `ok: true` — dự
      phòng phải chạy TRƯỚC lời tuyên kho-hỏng; (e) kho HỎNG, `process.env` cấp
      MỘT PHẦN → `kind: "store-unreadable"`, KHÔNG phải `missing`.
      NỬA ĐÀN ÁP: ca (b) và ca (c) phải ra HAI `kind` KHÁC NHAU — một hàm luôn trả
      `store-unreadable` sẽ qua được (c)(e) và chính là lỗi đối xứng của lỗi đang sửa.
      CHIỀU ĐỎ: khôi phục `loadEnvStore()` cũ trong `resolveConfig` thì (c) và (e)
      PHẢI đỏ với thông điệp nêu đúng chữ `store-unreadable` — không chỉ exit khác 0;
      và ca (d) phải VẪN xanh, nếu nó cũng đỏ thì bản vá đã hạ node dùng biến môi trường.
      CHIỀU ĐỎ THỨ HAI (khuôn writer): sửa một byte trong phong bì mà `saveEnvStore`
      sinh ra thì ca (a) PHẢI đỏ — chứng minh ca lành đang đọc đúng khuôn của bên GHI
      chứ không phải một khuôn test tự đặt.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-10
    executor: test
    cmd: config:executors.test.kkt_gd_env_client
    paths:
      - "src/lib/settings/env-client.ts"
      - "src/lib/settings/env-client.test.ts"
      - "src/lib/settings/__fixtures__/read-failures.ts"
    expected: >-
      exit 0. Ô NỀN cho cả AC-10 lẫn AC-12: bộ đọc dùng chung mà ba bề mặt đều đi qua.
      14 ca — năm hình dạng lỗi × (báo `unreadable`, gửi 0 `PUT`), cộng đối chứng dương
      rằng kho LÀNH vẫn gửi đúng 1 `PUT` và lượt ghi đó HỢP NHẤT (không xoá khoá khác),
      cộng lượt ghi huỷ-diệt mang cờ + `env` rỗng và KHÔNG đọc trước.
      NỬA ĐÀN ÁP: thiếu đối chứng dương thì một `saveEnvKeys` không bao giờ ghi cũng xanh.
      CHIỀU ĐỎ đã chạy: thu cổng về `status === 503` → đỏ ĐÚNG 6 ca, mỗi ca nêu tên hình
      dạng. Ca `503` và `network` vẫn xanh vì chúng đi qua hai cổng khác (JSON parse và
      `try/catch` quanh `fetch`) — con số 6 là số ĐO ĐƯỢC, không phải số dự đoán.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- B. Màn Cài đặt — tấm chặn (AC-10, đôi ô) ----------
  - id: E2
    criterion: AC-10
    executor: test
    cmd: config:executors.test.kkt_gd_settings_ui
    paths:
      - "src/components/workspace/settings-dialog.tsx"
      - "src/components/settings/store-unreadable-notice.tsx"
      - "src/lib/settings/env-client.ts"
      - "src/components/workspace/settings-dialog.unreadable.test.tsx"
    expected: >-
      exit 0. NĂM hình dạng lỗi đọc, mỗi hình dạng một ca, cùng một khẳng định:
      (1) 503 kèm `code: ENV_STORE_UNREADABLE`; (2) 500 thân JSON; (3) 502 thân HTML
      (`<html>...`); (4) 200 nhưng `env` là mảng; (5) `fetch` ném (`TypeError: fetch failed`).
      Cả năm: (a) KHÔNG còn ô nhập nào của form khoá trong màn — đếm bằng
      `queryAllByRole("textbox")` cộng input type=password, phải bằng 0 (form bị THAY,
      không bị phủ); (b) có phần tử `role="alert"` chứa lý do đọc được VÀ câu "chưa có
      gì bị thay đổi"; (c) nút Lưu CÓ MẶT trong cây (`getByRole("button", {name: Lưu})`
      không ném) và `disabled` — ẩn nó đi là TRƯỢT, chữ AC viết "hiện diện nhưng không
      bấm được"; (d) đúng MỘT nút thoát, đếm bằng `getAllByRole` trên nhãn thoát, độ dài 1.
      (e) đúng MỘT phần tử `[data-testid="store-unreadable-notice"]` — màn Cài đặt phải
      render CHÍNH component chia sẻ, không phải bản chép tay của nó; đây là dây nối
      giữa sàn a11y đo trên bản mẫu (E9) và bề mặt thật, vì `paths` chỉ là gợi ý
      carry-forward chứ không phải khẳng định.
      NỬA ĐÀN ÁP: một ca thứ sáu với 200 + `env` hợp lệ phải ra form BÌNH THƯỜNG (có ô
      nhập, nút Lưu bấm được, 0 tấm alert) — không có ca này thì một component luôn-chặn
      cũng xanh.
      CHIỀU ĐỎ: thu cổng `readEnvForBrowser` về `if (status === 503)` thì ca (2)(3)(4)(5)
      PHẢI đỏ, và thông điệp nêu đúng tên ca ("500", "502-html", "shape", "network") chứ
      không chỉ "expected 1 to be 0".
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

