      THƯỜNG — ô nhập xuất hiện trở lại và tấm alert biến mất.
      NỬA ĐÀN ÁP: bấm nút HUỶ trong hộp phải đưa về đúng trạng thái kho-hỏng (tấm alert
      còn, 0 ô nhập) — không có ca này thì một hộp thoại luôn-đóng-và-ghi cũng xanh.
      CHIỀU ĐỎ: đổi chữ trong hộp thành "Bạn có chắc không?" thì (b) PHẢI đỏ, và thông
      điệp nêu đúng cụm bị thiếu.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-11
    executor: test
    layer: backend-effect
    cmd: config:executors.test.kkt_gd_replace_wire
    paths:
      - "src/components/workspace/settings-dialog.tsx"
