    expected: >-
      exit 0. RĂNG của guard E11 — chứng minh guard đó đỏ được, chứ không chỉ xanh.
      Ba ca trên BẢN SAO của cây: (1) cây thật → exit 0; (2) chèn thêm một
      `fetch("/api/settings/env")` vào `abi-node-shell.tsx` → exit 1 VÀ thông điệp phải
      NÊU TÊN tệp vi phạm; (3) làm rỗng `env-client.ts` → exit 2 (guard không còn gì để
      đo thì phải nói ra, chứ không được xanh).
      Vì sao cần: E11 là một guard tĩnh, và một guard tĩnh xanh vĩnh viễn trông y hệt
      một guard xanh vì grep gõ sai. Ô này là chỗ duy nhất chứng minh nó biết đỏ.
      CHIỀU ĐỎ: nới `grep` của guard để bỏ qua `src/components/**` thì ca (2) PHẢI đỏ.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

