    expected: >-
      exit 0. Đếm trên `fetch.mock.calls` suốt cả chuỗi mở-màn → bấm-thoát → xác nhận:
      (a) tổng số lượt `PUT` bằng ĐÚNG 1; (b) lượt `PUT` duy nhất đó có
