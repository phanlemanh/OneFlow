schema_version: 1
feature_slug: director-wire-shape

# T3, surfaces [api, db]. Goi CHI GHI, chua DOC — nen phan lon eval la eval MAY tat dinh.
#
# MOT eval chay tay duy nhat (E14), theo quyet dinh cua owner 26/08: moi executor da khai
# trong _acceptance/config.yaml deu la lenh tat dinh, khong khoa API, khong buoc network.
# Golden set 30 prompt can ca hai. Khai 8 eval judgment se bat nguoi kiem 8 lan cho cung
# mot phep do. Bang chung cua E14 la anh chup MOT LAN, khong tai chay duoc trong CI —
# ghi ro de Cong 2 khong doi dieu bat kha.
#
# `paths` khai tren moi eval may de vong sau carry-forward duoc phan diff khong cham toi.
#
# LUU Y CHO NGUOI HIEN THUC: cac lenh `config:executors.script.dws_*` CHUA TON TAI trong
# _acceptance/config.yaml. Them chung la mot phan cua goi, va la dieu kien qua Cong 1.

evals:
  # ---------- A. Wire shape — plan toi duoc client ----------
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.dws_wire_returns_plan
    paths: ["src/app/api/director/route.ts", "src/lib/director/director-core.ts"]
    expected: "exit 0; response thanh cong chua CA BA truong planJson (parse duoc thanh object hop le theo DirectorPlanSchema), runId (chuoi khong rong), dslVersion (so nguyen == DIRECTOR_DSL_VERSION). SUPPRESSION half: chay lai tren nhanh truoc goi nay phai DO — neu xanh ca hai thi phep do khong do gi"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.dws_old_client_unaffected
    paths: ["src/app/api/director/route.ts"]
    expected: "exit 0; bon truong name/description/nodes/edges co mat, dung kieu, va KHONG truong nao trong so do doi ten hay doi hinh dang. Kiem bang cach destructure dung nhu route.ts:67-69 lam va khang dinh ket qua khong undefined"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.dws_error_envelope
    paths: ["src/app/api/director/route.ts", "src/app/api/director/route.test.ts"]
    expected: "exit 0; voi CA BAY DirectorErrorCode, ma HTTP khop STATUS_BY_CODE va than loi giu nguyen {error:{code,message,details}}. Bay ma phai duoc liet ke tuong minh trong test, khong lap qua enum — mot ma bi xoa khoi enum se lam test vacuous"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- B. So su kien — may bat dau nho ----------
  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.dws_event_written_server_side
    paths: ["src/app/api/director/route.ts", "src/db/**"]
    expected: "exit 0; sau MOT loi goi /api/director, dem row director_events kind='generated' mang runId do == 1. Chay ca hai nhanh: luot THANH CONG va luot HONG — ca hai deu phai ghi. SUPPRESSION half: mo phong client dong tab giua chung (abort request) van phai co row, vi ghi o phia server"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.dws_feedback_state_machine
    paths: ["src/app/api/director/feedback/**", "src/db/**"]
    expected: "exit 0; ba khang dinh: (a) va lan dau tu 'generated' sang moi outcome hop le -> 200 va row doi; (b) va lan HAI cho cung runId -> tu choi, row KHONG doi; (c) runId khong ton tai -> tu choi. Thieu (b) thi endpoint la duong ghi thang vao pool hoc khong gate"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.dws_events_schema_shape
    paths: ["src/db/**", "drizzle/**"]
    expected: "exit 0; 13 cot co mat dung ten, va moi truong suy dien (attempts, errorCode, usedMemory, memoryBlockDigest, estimateMs, workflowId) la NULLABLE. Khang dinh danh sach cot LITERAL, khong doc tu chinh dinh nghia schema — doc tu schema thi test tu thoa"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.dws_workflow_run_provenance
    paths: ["src/db/**", "src/app/api/workspace/**"]
    expected: "exit 0; workflow luu tu ke hoach Director co directorRunId == runId da sinh no; workflow dung tay co directorRunId IS NULL. Hai nhanh, khong chi mot"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- C. Body versioned — khai hinh dang, chua dung ----------
  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.dws_body_backward_compatible
    paths: ["src/app/api/director/route.ts", "src/app/api/director/route.test.ts"]
    expected: "exit 0; body {prompt} co hanh vi Y HET truoc goi: tran 2000 ky tu, cung ma loi, cung thong diep. Doi chieu voi chuoi thong diep LITERAL, khong voi hang so — doi hang so ma quen doi test se lot"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.dws_body_per_field_caps
    paths: ["src/app/api/director/route.ts"]
    expected: "exit 0; truong turns/canvas/options VANG hoac RONG -> hanh vi y het E8; vuot tran theo TUNG truong -> INVALID_PROMPT va thong diep neu DUNG TEN truong vuot han. Mot thong diep chung chung 'body too large' la khong dat"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- D. Rang buoc khong duoc vi pham ----------
  - id: E10
    criterion: AC-10
    executor: script
    cmd: config:executors.script.dws_expect_count_unchanged
    paths: ["src/**"]
    expected: "exit 0; pnpm test xanh VA so expect() trong src/lib/director/** cong src/app/api/director/** bang dung con so truoc goi (217 tinh o 4b9c1c7, doc lai tai base_commit cua goi). Goi nay chi THEM"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-11
    executor: test
    cmd: config:executors.test.dws_migrator_on_old_db
    paths: ["drizzle/**", "src/db/**"]
    expected: "exit 0; migrator that chay tren ban sao db tao TRUOC goi nay; sau migration db mo duoc, bang cu con nguyen so row, bang moi ton tai. Tien le metering-schema.test.ts:15-25"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-12
    executor: script
    cmd: config:executors.script.dws_barrel_export
    paths: ["src/db/schema.ts", "src/db/workspace.schema.ts"]
    expected: "exit 0; bang moi xuat hien trong src/db/schema.ts. Quen mot dong export thi drizzle.config.ts va ext-default/db.ts khong thay bang — migration sinh ra thieu"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-13
    executor: script
    cmd: config:executors.script.dws_no_prompt_in_prod_log
    paths: ["src/lib/director/director.server.ts", "src/lib/logger.ts"]
    expected: "exit 0; moi loi goi ghi promptText ra log deu di qua logger.debug (no-op ngoai development). SUPPRESSION half: chen mot logger.info(prompt) gia phai lam eval nay DO"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- E14a / E14b — hai phep do, hai dung cu ----------
  #
  # Tach 26/08 SAU KHI chay E14 lan dau (evidence/e14-2026-08-26.md). Ban goc gop
  # ba cau vao mot eval, nhung cau (3) — ty le row mo coi — VE NGUYEN TAC khong
  # do duoc bang script: run-baseline.mjs goi thang /api/director, con
  # /api/director/feedback chi duoc goi tu UI (bon nhanh trong director-prompt.tsx).
  # Script luon cho 100% mo coi du hien thuc dung hay sai. Mot nguong khong the
  # dat bang dung cu da khai la mot nguong vo nghia, khong phai mot nguong nghiem khac.
  - id: E14a
    criterion: AC-4
    executor: judgment
    question: >-
      Chay `node _acceptance/director-wire-shape/golden/run-baseline.mjs` tren cau
      hinh khop `golden/frozen-config.json` (bo do TU DUNG voi ma 2 neu lech — xem
      ghi chu duoi), roi tra loi bang so:
      (1) ty le thanh cong co >= 86,7% khong — moc EVAL-0 ngay 26/08?
      (2) so row `director_events` TANG THEM co bang dung so luot goi khong?
      Cau (2) hoi PHAN TANG THEM chu khong phai tong: so la append-only, khong reset
      giua cac lan chay. Ban goc hoi "== 30" va do la sai khuon.
      Neu cau (1) truot: goi nay lam Director TE DI, dung ban ve "chi them, khong doi
      hanh vi" — dieu goi nay khong duoc phep lam.
    expected: "Ca hai cau CO. Bang chung la anh chup mot lan (output bo do + ket qua truy van), KHONG tai chay duoc trong CI vi can khoa API va dev server. Bo do doi chieu plugins/ voi frozen-config.json va thoat ma 2 khi lech — mot lan chay tren cau hinh khac la mot phep do ve mot Director khac (bai hoc 26/08: worktree rong cho 30/30 vi vocabulary rong nen moi plan chi con step text)"
    evidence_required: [verifier, verified_at, output, notes]

  - id: E14b
    criterion: AC-5
    executor: judgment
    question: >-
      TRONG GIAO DIEN, khong dung script: mo panel Director, go 5 prompt tieng Viet
      bat ky, va di qua CA BA nhanh quyet dinh — mot lan tren canvas RONG (ap dung
      ngay), mot lan tren canvas CO NODE roi BAM XAC NHAN, mot lan tren canvas co
      node roi HUY (Escape hoac bam ra ngoai). Sau do truy van:
      `SELECT kind, count(*) FROM director_events GROUP BY kind`.
      Ty le row con o `generated` (chua duoc va outcome) co < 10% khong?
      Va co xuat hien du ca `accepted`, `replaced`, `discarded` khong?
    expected: "Ty le mo coi < 10%, va ba kind outcome deu co mat. Day la nua ma script KHONG do duoc: chi UI goi /api/director/feedback. Neu mot kind vang mat thi mot nhanh quyet dinh khong duoc noi day — nhanh `discarded` la de sot nhat vi no di qua onOpenChange chu khong qua rieng nut Cancel"
    evidence_required: [verifier, verified_at, output, notes]
