schema_version: 1
feature_slug: chong-mat-khoa-byo

# T3. Ba criterion mang tag (cross-layer) — AC-10, AC-11, AC-12 — vì When/Then của
# chúng đi qua máy chủ (đọc kho, quyết định có gửi PUT hay không). Mỗi criterion đó
# mang CẢ một eval `layer: backend-effect` chứng minh nửa server, LẪN một ui-check
# khẳng định dấu vết trên màn hình. ui-check một mình không bao giờ đủ.
# AC-1..AC-9 chạy hoàn toàn phía server nên KHÔNG mang tag.
#
# KHÔNG eval nào dùng mock cho seam lưu trữ. `vitest.config.ts` alias
# `@ext -> src/ext-default`, và `dataDir()` đọc `TONGFLOW_DATA_DIR`, nên mọi eval
# tầng seam/lõi/API chạy trên MỘT THƯ MỤC TẠM THẬT: fixture là file thật, quyền
# thật, byte thật. Chú thích trong chính `vitest.config.ts` ghi lại vì sao —
# "which is how the AC-9 round trip ended up asserting against a mock".
#
# Đường file mới chọn theo GIÁ RE-PIN đã đo, không theo thói quen. Đối chiếu
# `paths` đã khai của 14 hồ sơ: một file mới dưới `scripts/acceptance/**` kéo
# `gate-tooling-t1` + `stale-scope-by-paths` vào wave re-pin, còn dưới
# `scripts/settings/**` thì kéo THÊM 0 hồ sơ. Nên hai phép đo ban đầu định viết
# bằng shell (đĩa-không-đổi, i18n) chuyển sang `executor: test` — chúng không cần
# trình duyệt, và `test` vốn ưu tiên cao hơn `script`; còn E17 GIỮ shell dưới
# `scripts/settings/` vì nó cần Chrome thật và phải tự dựng/dọn server.
#
# `paths` khai trên mọi eval để round sau carry-forward phần diff không chạm.
# Suite commands (`feature_loop.suite_keys`) LUÔN chạy lại.
#
# MỌI eval "từ chối" đo HAI CHIỀU trên cùng fixture (MEASURE-BIRTH-CLAUSE): vật
# lành → xanh, phá vật thật → đỏ với thông điệp ghim. Chiều đỏ ghi trong `expected`.

evals:
  # ---------- A. Seam — chỗ nuốt lỗi thứ hai ----------
  - id: E1
    criterion: AC-1
    executor: test
    cmd: config:executors.test.unit_byo_seam
    paths: ["src/ext-default/settings-store.ts", "src/lib/settings/env-store.server.test.ts"]
    expected: >-
      exit 0; trên MỘT thư mục tạm thật trỏ bằng TONGFLOW_DATA_DIR: (a) chưa có file
      → readSettingsBlob() trả null; (b) file `chmod 000` → NÉM, và lỗi ném ra mang
      code 'EACCES'; (c) đường dẫn là thư mục → NÉM với code 'EISDIR'. NỬA ĐÀN ÁP:
      ca (a) phải trả null chứ không ném — một hàm luôn-ném sẽ qua được (b)(c) và
      chính là lỗi bị canh. CHIỀU ĐỎ: khôi phục `catch { return null }` cũ thì (b)(c)
      PHẢI đỏ với thông điệp nêu đúng chữ 'EACCES'/'EISDIR', không chỉ exit khác 0.
      Ca (b) tự bỏ qua khi chạy dưới uid 0 (chmod không chặn được root) và phải NÊU
      rõ nó bỏ qua — bỏ qua câm là xanh giả.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- B. Lõi — một nguồn, ba trạng thái ----------
  - id: E2
    criterion: AC-2
    executor: test
    cmd: config:executors.test.unit_byo_read_ok_absent
    paths: ["src/lib/settings/env-store.server.ts", "src/lib/settings/env-store.server.test.ts"]
    expected: >-
      exit 0; kho chứa JSON object hợp lệ → readEnvStore() trả state 'ok' kèm map
      ĐÚNG BẰNG nội dung đã ghi (so từng cặp khoá-giá trị, không chỉ so số lượng);
      kho chưa có → trả state 'absent'. NỬA ĐÀN ÁP: 'absent' phải KHÁC 'unreadable'
      — một hàm luôn-trả-'unreadable' qua được vế đầu. CHIỀU ĐỎ: đổi nhánh absent
      thành 'unreadable' thì eval đỏ với thông điệp chứa chữ 'absent'.
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E3
    criterion: AC-3
    executor: test
    cmd: config:executors.test.unit_byo_read_unreadable
    paths: ["src/lib/settings/env-store.server.ts", "src/lib/settings/env-store.server.test.ts"]
    expected: >-
      exit 0; MA TRẬN TOÀN PHẦN bốn nguyên nhân — số assert BẰNG số phần tử: io
      (seam ném), parse (file chứa '{oops'), shape (file chứa '[1,2,3]'), decode
      (decodeEnvStore ném). Cả bốn trả state 'unreadable', và `reason` PHÂN BIỆT
      được bốn ca (bốn giá trị khác nhau, assert trên nội dung reason chứ không
      trên một boolean). CHIỀU ĐỎ: ca `shape` chạy trên mã hôm nay (`:28-30` trả
      `{}`) PHẢI đỏ với thông điệp nêu chữ 'shape' — đây là ca sót dễ nhất và là
      lý do eval này tồn tại tách khỏi E2.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: test
    cmd: config:executors.test.unit_byo_load_tolerant
    paths: ["src/lib/settings/env-store.server.ts", "src/lib/settings/env-store.server.test.ts"]
    expected: >-
      exit 0; loadEnvStore() chạy qua CẢ SÁU trạng thái (ok, absent, io, parse,
      shape, decode) và KHÔNG ném lần nào; trả map thật ở 'ok' và `{}` ở năm ca
      còn lại — đúng hành vi trước gói việc này. Đây là eval chứng minh quyết định
      2 (nhóm Đọc-để-chạy không đổi). CHIỀU ĐỎ: cho loadEnvStore ném ở ca 'io' thì
      eval đỏ với thông điệp nêu chữ 'tolerant'/'không được ném'.
    evidence_required: [run_id, exit_code, verifier, verified_at]

  # ---------- C. API — chỗ mất dữ liệu ----------
  - id: E5
    criterion: AC-5
    executor: test
    cmd: config:executors.test.unit_byo_route_get
    paths: ["src/app/api/settings/env/route.ts", "src/app/api/settings/env/route.unreadable.test.ts"]
    expected: >-
      exit 0; kho hỏng → GET trả status 503 và body có code === 'ENV_STORE_UNREADABLE'
      (assert trên chuỗi code, không trên "có trường error"); kho CHƯA CÓ → GET trả
      200 với env deep-equal {}. NỬA ĐÀN ÁP là vế absent: một route luôn-503 sẽ qua
      vế đầu. CHIỀU ĐỎ: trả 200 ở ca hỏng thì eval đỏ nêu chữ '503'.
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E6
    criterion: AC-6
    executor: test
    cmd: config:executors.test.unit_byo_route_put_refuse
    paths: ["src/app/api/settings/env/route.ts", "src/app/api/settings/env/route.unreadable.test.ts"]
    expected: >-
      exit 0; TRỌNG TÂM. Trên thư mục tạm THẬT: ghi một blob hỏng có nội dung biết
      trước, đọc BYTES của file (sha256), gọi PUT không cờ với một map khác, rồi đọc
      lại BYTES. Assert: status === 409 VÀ sha256 trước === sha256 sau. Hai vế phải
      cùng có — một route trả 409 rồi vẫn ghi sẽ qua vế thứ nhất, và đó chính là lỗi
      đang sửa. Đây là phép đo đã chạy trên `git config` ở §Context của hợp đồng.
      CHIỀU ĐỎ: bỏ chốt chặn 409 (để PUT ghi như hôm nay) thì eval đỏ với thông điệp
      nêu sha256 lệch, không chỉ nêu status.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: test
    cmd: config:executors.test.unit_byo_route_put_force
    paths: ["src/app/api/settings/env/route.ts", "src/app/api/settings/env/route.unreadable.test.ts"]
    expected: >-
      exit 0; kho hỏng + PUT kèm replaceUnreadableStore:true → status 200; GET ngay
      sau đó trả 200 với env deep-equal map vừa ghi và state của kho là 'ok'. CHIỀU
      ĐỎ: để cờ không có tác dụng (vẫn 409) thì eval đỏ nêu chữ 'replaceUnreadableStore'.
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E8
    criterion: AC-8
    executor: test
    cmd: config:executors.test.unit_byo_route_no_regression
    paths: ["src/app/api/settings/env/route.ts", "src/app/api/settings/env/route.test.ts"]
    expected: >-
      exit 0; kho 'ok' và kho 'absent': GET 200, PUT ghi được, và `verdicts` vẫn trả
      về cho khoá đã đổi y như trước gói việc này. THÊM: PUT kèm cờ khi kho LÀNH thì
      cờ BỊ BỎ QUA — kết quả giống hệt PUT không cờ (so deep-equal cả body lẫn nội
      dung đĩa). Vế sau canh đúng thứ Notes hợp đồng nêu: cờ không được thành đường
      ghi thứ hai. CHIỀU ĐỎ: cho cờ đi nhánh riêng khi kho lành thì eval đỏ.
    evidence_required: [run_id, exit_code, verifier, verified_at]

  - id: E9
    criterion: AC-9
    executor: test
    cmd: config:executors.test.unit_byo_aml_config
    paths: ["src/lib/media-library/config.server.ts", "src/lib/media-library/config.server.test.ts"]
    expected: >-
      exit 0; GHIM DISCRIMINANT, không phải bất đẳng thức. Ca kho HỎNG: kết quả
      mang đúng `code === "ENV_STORE_UNREADABLE"`, VÀ không khớp
      /nhập lại|nhập khoá|enter.*key/i — câu nào mời người dùng nhập lại khoá là
      câu dẫn thẳng vào đường mất dữ liệu mà §Context đặt tên, nên đó là assert âm
      có ghim chuỗi. ĐỐI CHỨNG DƯƠNG: ca kho LÀNH NHƯNG THIẾU KHOÁ phải KHÔNG mang
      mã đó và VẪN nêu đích danh biến còn thiếu (giữ nguyên AC-1 của
      add-media-library). CHIỀU ĐỎ: quy cả hai ca về một kết quả, hoặc để ca hỏng
      trả câu "vui lòng nhập lại hai khoá", thì eval đỏ nêu chữ
      "kho hỏng vẫn mời nhập lại khoá". Bản đầu chỉ assert "hai kết quả KHÁC NHAU"
      — một bất đẳng thức mà hai câu chữ nguy hiểm khác nhau cũng thoả (gap-probe P1).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  # ---------- D. UI — ba mặt, ba mức ----------
  - id: E10
    criterion: AC-10
    layer: backend-effect
    executor: test
    cmd: config:executors.test.unit_byo_settings_dialog_503
    paths: ["src/components/workspace/settings-dialog.tsx", "src/components/workspace/settings-dialog.test.tsx"]
    expected: >-
      exit 0; mount settings-dialog THẬT (RTL, @vitest-environment jsdom) với fetch
      giả trả 503 + code ENV_STORE_UNREADABLE, rồi assert BỐN vế trên chính DOM đó:
      (1) không phần tử input khoá nào — form bị THAY chứ không bị phủ; (2) nút Lưu
      CÓ MẶT và disabled (không phải vắng mặt); (3) số nút thoát đếm được === 1;
      (4) câu "chưa có gì bị thay đổi" có mặt. ĐỐI CHỨNG DƯƠNG cùng file: với fetch
      trả 200 + env rỗng, màn phải hiện form BÌNH THƯỜNG và Lưu KHÔNG disabled —
      một màn luôn-báo-hỏng sẽ qua bốn vế trên. CHIỀU ĐỎ: để fetchEnv nuốt lỗi như
      hôm nay (logger.error rồi form rỗng) thì eval đỏ với thông điệp nêu chữ
      "form rỗng khi 503". Ô này thay bản đầu — bản đầu dùng lại ĐÚNG lệnh của E5,
      nên AC-10 khi ấy không có ô nào chạm màn Cài đặt thật (gap-probe P0).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-10
    executor: ui-check
    steps:
      - "Mở {url}/proto/chong-mat-khoa-byo?state=store-unreadable → chụp _acceptance/chong-mat-khoa-byo/evidence/E11-step1.png"
      - "Assert: KHÔNG có ô nhập khoá nào trên màn (form đã bị THAY, không phải bị phủ lên)"
      - "Assert: có câu nói rõ chưa có gì bị thay đổi, đọc được bằng mắt trong ảnh"
      - "Assert: nút Lưu CÓ MẶT và ở trạng thái disabled (không phải vắng mặt)"
      - "Assert: có ĐÚNG MỘT nút thoát"
    expected: >-
      bốn assert cùng đạt. Nút Lưu vắng mặt là FAIL — hợp đồng đòi tắt chứ không đòi
      ẩn. Hai nút thoát trở lên là FAIL. Một màn còn ô nhập khoá bên dưới tấm lỗi là
      FAIL kể cả khi tấm lỗi hiện đúng.
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E12
    criterion: AC-11
    layer: backend-effect
    executor: test
    cmd: config:executors.test.unit_byo_escape_wire
    paths: ["src/components/workspace/settings-dialog.tsx", "src/components/workspace/settings-dialog.test.tsx"]
    expected: >-
      exit 0; nửa server của AC-11 — dựng màn ở trạng thái kho-hỏng với fetch bị
      theo dõi, bấm nút thoát rồi xác nhận, và assert trên DANH SÁCH lời gọi: đúng
      MỘT PUT tới /api/settings/env, body có replaceUnreadableStore === true, và
      KHÔNG lời gọi PUT nào khác trước đó. Assert "không có PUT không cờ" là vế đàn
      áp — nó bắt ca màn gửi một PUT thường rồi mới gửi PUT có cờ. CHIỀU ĐỎ: cho màn
      gửi PUT thường trước thì eval đỏ nêu số lời gọi đếm được.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-11
    executor: ui-check
    steps:
      - "Mở {url}/proto/chong-mat-khoa-byo?state=store-unreadable-confirm → chụp _acceptance/chong-mat-khoa-byo/evidence/E13-step1.png"
      - "Assert: hộp xác nhận nói rõ khoá sẽ MẤT và KHÔNG KHÔI PHỤC ĐƯỢC — đọc được bằng mắt trong ảnh, không phải câu chung chung kiểu 'bạn có chắc không'"
      - "Assert: có cả nút Huỷ lẫn nút xác nhận, và nút xác nhận mang lối huỷ-diệt"
    expected: >-
      hộp xác nhận nêu ĐÚNG hai ý mất-và-không-khôi-phục. Một câu 'bạn có chắc
      không?' là FAIL — quyết định 4 bỏ đường sao lưu nên câu chữ là hàng rào duy
      nhất, và nó phải nói ra cái giá.
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  - id: E14
    criterion: AC-12
    layer: backend-effect
    executor: test
    cmd: config:executors.test.unit_byo_panels_refuse
    paths:
      - "src/components/workspace/nodes/add/media-library-config-panel.tsx"
      - "src/components/workspace/nodes/base/abi-node-shell.tsx"
      - "src/components/workspace/nodes/add/media-library-config-panel.test.tsx"
      - "src/components/workspace/nodes/base/abi-node-shell.test.tsx"
      - "src/components/workspace/node-key-prompt.tsx"
      - "src/components/workspace/node-key-prompt.test.tsx"
    expected: >-
      exit 0; BA vế (vòng 2 thêm vế 3 sau REJECT vòng 1), mỗi vế ma trận hai panel (số assert bằng số panel).
      VẾ 1 — với GET trả 503, thao tác lưu ở CẢ HAI panel phát ra KHÔNG một lời
      gọi PUT nào (assert trên danh sách lời gọi đã theo dõi, = 0).
      VẾ 2 — quyết định 3: ở trạng thái kho-hỏng, mỗi panel có
      queryAllByRole("button", {name: /bỏ kho cũ|nhập lại|thoát/i}).length === 0,
      và ĐỐI CHỨNG DƯƠNG là cùng truy vấn đó trên settings-dialog phải === 1 —
      không có đối chứng thì một truy vấn sai chính tả cũng cho 0 ở mọi nơi.
      VẾ 3 — thứ người dùng THẤY, và cái dây dẫn tới nó: pha rơi vào
      `store-unreadable` chứ KHÔNG phải `invalid` (đo qua chính hook thật, có
      đối chứng dương là ca nhà cung cấp từ chối vẫn phải ra `invalid`), và màn
      hiện câu đã dịch + lối sang Cài đặt, KHÔNG hiện mã máy `ENV_STORE_UNREADABLE`,
      KHÔNG đặt aria-invalid. Vòng 1 thiếu đúng vế này: nó đo lỗi được NÉM và số
      PUT, nên panel từ chối đúng mà vẫn nói với người dùng rằng khoá của họ hỏng.
      Vế 2 sinh từ gap-probe P1: trước đó nó chỉ được đo trên bản mẫu (E15). CHIỀU ĐỎ: gỡ
      chốt chặn ở abi-node-shell (trạng thái hôm nay, nơi `loaded.ok` không hề được
      kiểm) thì eval đỏ và nêu đích danh panel nào đã gửi PUT.
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E15
    criterion: AC-12
    executor: ui-check
    steps:
      - "Mở {url}/proto/chong-mat-khoa-byo?state=panel-unreadable → chụp _acceptance/chong-mat-khoa-byo/evidence/E15-step1.png"
      - "Assert: cả hai panel hiện câu lỗi và lối sang màn Cài đặt, đọc được bằng mắt"
      - "Assert: KHÔNG panel nào có nút bỏ-kho-cũ"
    expected: >-
      hai panel cùng đạt. Một nút thoát xuất hiện trong panel node là FAIL — quyết
      định 3 đặt nút đó CHỈ ở màn Cài đặt.
    evidence_required: [run_id, exit_code, verifier, verified_at, screenshot]

  # ---------- E. Cắt ngang ----------
  - id: E16
    criterion: AC-13
    executor: test
    cmd: config:executors.test.unit_byo_locale_parity
    paths: ["src/i18n/messages/en.json", "src/i18n/locale-parity.test.ts"]
    expected: >-
      exit 0; danh sách khoá RÚT TỪ WRITER THẬT, không từ một hằng viết tay: test
      quét các lời gọi `t("...")` trong đúng tập file mà gói việc này khai
      (settings-dialog, hai panel node, proto), rồi mới đối chiếu 5 tệp locale.
      Mỗi khoá phải có mặt ở đủ en/ja/ko/vi/zh, và giá trị ja/ko/vi/zh KHÁC chuỗi
      tiếng Anh (bắt ca chép nguyên bản Anh sang bốn tệp kia). Phạm vi hẹp theo
      TẬP FILE có chủ ý: repo đã có nợ 76 khoá thiếu ở ja.json, một phép đo toàn
      repo sẽ đỏ vì nợ cũ và nói dối về gói việc này. HAI CHIỀU ĐỎ: (a) xoá một
      khoá khỏi ja.json → đỏ nêu đích danh khoá + tên tệp; (b) thêm một
      `t("khoa.moi")` vào mã mà không dịch → PHẢI đỏ. Chiều (b) là chiều mà bản
      hằng-viết-tay KHÔNG THỂ đỏ, và là lý do ô này được viết lại (gap-probe P1,
      cùng lớp [chong-doc-sai-em-ru#F1]).
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E17
