# 13 eval / 12 tiêu chí — AC-7 có hai eval (chiều xanh sống + chiều đỏ fixture).
# CHỈ E9/E11 phụ thuộc mạng + gh auth (tiền lệ: guard clone-plugin của
# compose-overlay) — chạy local trong vòng verify, KHÔNG wire vào CI. Mọi eval
# khác offline thuần; E12 cố ý CHỈ offline để không gộp exit code mạng vào một
# khẳng định tích hợp (bài học stale-scope-by-paths#F1).
# Mọi eval khai `paths` — hợp đồng này tự ăn cơ chế scope hẹp mà nó sửa.
schema_version: 1
feature_slug: gate-scope-anchors
evals:
  - id: E1
    criterion: AC-1
    executor: script
    cmd: config:executors.script.gate_ns_exempt_refused
    paths: ["scripts/pre-merge-check.sh", "scripts/acceptance/test-scope-namespace.sh"]
    expected: "exit 0; fixture khai paths toàn glob t1-exempt → pre-merge-check TỪ CHỐI scope hẹp, in NOTE nêu lý do, staleness áp whole-tree; harness gỡ bản sửa (perturbation in-process) → case này ĐỎ"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E2
    criterion: AC-2
    executor: script
    cmd: config:executors.script.gate_ns_variants_red
    paths: ["scripts/pre-merge-check.sh", "scripts/acceptance/test-scope-namespace.sh"]
    expected: "exit 0; từng biến thể 1-4 được tái tạo bằng perturbation in-process và harness ĐỎ cho từng cái — không guard nào vacuous"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E3
    criterion: AC-3
    executor: script
    cmd: config:executors.script.gate_ns_legit_granted
    paths: ["scripts/pre-merge-check.sh", "scripts/acceptance/test-scope-namespace.sh"]
    expected: "exit 0; fixture khai paths trỏ code thật → scope hẹp VẪN được cấp, NOTE 'narrow staleness scope applied' in như hiện tại"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E4
    criterion: AC-4
    executor: script
    cmd: config:executors.script.own_range_anchored
    paths: ["scripts/acceptance/own-range.sh", "scripts/acceptance/test-own-range.sh"]
    expected: "exit 0; own-range.sh với landed_merge=8477f8a (PR #17 thật) in range_from/range_to đúng và commits chứa CẢ 60c4797 LẪN b48699c6"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E5
    criterion: AC-5
    executor: script
    cmd: config:executors.script.own_range_unlanded
    paths: ["scripts/acceptance/own-range.sh", "scripts/acceptance/test-own-range.sh"]
    expected: "exit 0; contract không có landed_merge → range = merge-base(HEAD, main)..HEAD, trùng từng byte với hành vi hiện tại"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E6
    criterion: AC-6
    executor: script
    cmd: config:executors.script.own_range_malformed
    paths: ["scripts/acceptance/own-range.sh", "scripts/acceptance/test-own-range.sh"]
    expected: "exit 0; BA ca riêng — sha không tồn tại, commit thường (không phải merge), sha rác — đều exit 2 với thông điệp nêu đúng lỗi; guard tiêu thụ cũng exit 2, không ca nào xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E7
    criterion: AC-7
    executor: script
    cmd: config:executors.script.b1_anchored_green
    paths: ["scripts/acceptance/own-range.sh", "scripts/plugins/check-no-config-drift.sh", "scripts/deps/check-no-t3-drift.sh", "scripts/ci/check-workflow-drift.sh"]
    expected: "exit 0; ca repro sống: cả ba guard B1 anchored chạy trên feat/compose-overlay hôm nay đều exit 0 — đúng ba lệnh từng exit 1/1/2 vì đo nhầm PR"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E8
    criterion: AC-7
    executor: script
    cmd: config:executors.script.b1_violation_red
    paths: ["scripts/acceptance/own-range.sh", "scripts/acceptance/test-own-range.sh", "scripts/plugins/check-no-config-drift.sh"]
    expected: "exit 0; fixture repo có merge commit mà khoảng PR của CHÍNH NÓ đụng đường cấm → guard anchored exit 1 — neo không được biến guard thành máy gật đầu"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E9
    criterion: AC-8
    executor: script
    cmd: config:executors.script.b2_runs_found
    paths: ["scripts/ci/gh-run-lib.sh", "scripts/ci/check-run-jobs.sh", "scripts/ci/check-gate-plumbing.sh", "scripts/ci/check-dispatch-run.sh", "scripts/acceptance/own-range.sh"]
    expected: "exit 0; check-run-jobs + check-gate-plumbing + check-dispatch-run docker/desktop cho ci-actions-bump anchored đều tìm được run lịch sử qua TẬP COMMIT (run CI ở 60c4797, hai run dispatch ở b48699c6) và exit 0 trên nhánh này. Phụ thuộc mạng + gh auth"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E10
    criterion: AC-10
    executor: script
    cmd: config:executors.script.b2_no_run_exit2
    paths: ["scripts/ci/gh-run-lib.sh", "scripts/acceptance/test-own-range.sh"]
    expected: "exit 0; neo hợp lệ nhưng tập commit không có run nào (fixture) → eval B2 exit 2 'không nhìn được', KHÔNG xanh"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E11
    criterion: AC-9
    executor: script
    cmd: config:executors.script.ghcr_anchored
    paths: ["scripts/ci/check-ghcr-untouched.sh", "scripts/ci/gh-run-lib.sh", "scripts/acceptance/own-range.sh"]
    expected: "exit 0; nửa log giữ nguyên logic; nửa registry giới hạn cửa sổ [createdAt run dispatch, committer-date landed_merge]; exit 0 cho ci-actions-bump trên nhánh này. Phụ thuộc mạng + gh auth"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E12
    criterion: AC-11
    executor: script
    cmd: config:executors.script.anchors_backfilled
    paths: ["scripts/acceptance/own-range.sh", "scripts/acceptance/test-own-range.sh", "scripts/plugins/check-no-config-drift.sh", "scripts/deps/check-no-t3-drift.sh", "scripts/ci/check-workflow-drift.sh"]
    expected: "exit 0; OFFLINE thuần, liệt kê tường minh từng khẳng định: (1) own-range.sh giải được cả ba neo 8477f8a/4d89b58/dd39da8, (2) config.yaml truyền ACCEPTANCE_SLUG cho guard của ba hồ sơ, (3) ba guard B1 chạy với slug tương ứng đều exit 0. Guard mạng của ci-actions-bump KHÔNG nằm trong eval này — chúng thuộc E9/E11"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]

  - id: E13
    criterion: AC-12
    executor: script
    cmd: config:executors.script.b1_unanchored_compat
    paths: ["scripts/acceptance/own-range.sh", "scripts/acceptance/test-own-range.sh", "scripts/plugins/check-no-config-drift.sh", "scripts/ci/gh-run-lib.sh"]
    expected: "exit 0; đường KHÔNG-neo giữ nguyên từng byte: (1) fixture có vi phạm, ACCEPTANCE_SLUG vắng → guard B1 exit 1 như hôm nay; (2) fixture sạch, env vắng → exit 0; (3) helper tra-run của gh-run-lib không neo phân giải đúng HEAD hiện tại (so chuỗi với git rev-parse HEAD, offline). Range rỗng-oan khiến mọi PR mở xanh oan phải làm eval này ĐỎ"
    evidence_required: [run_id, exit_code, verifier, verified_at, output]
